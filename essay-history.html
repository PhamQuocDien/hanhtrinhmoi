<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Xem lại bài tự luận đã nộp, điểm số và nhận xét chấm bài.">
<title>Lịch sử bài tự luận | Hành Trình Mới</title>
<link rel="stylesheet" href="assets/platform/platform-shell.css"><link rel="stylesheet" href="assets/platform/flow-pages.css"><link rel="stylesheet" href="assets/css/ai-autopilot.css?v=39.0.0">
<style>.essay-history-list{display:grid;gap:14px}.essay-attempt{border:1px solid var(--line,#dce4ee);border-radius:14px;padding:18px;background:var(--surface,#fff)}.essay-attempt h2{font-size:1.05rem;margin:0 0 8px}.essay-score{font-size:1.35rem;font-weight:750}.essay-copy{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;background:var(--surface-muted,#f5f7fb);padding:12px;border-radius:10px}.essay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.essay-muted{color:var(--muted,#637083)}.essay-attempt ul{padding-left:22px}.essay-error{color:#a52828}</style>
</head>
<body class="flow-page"><main class="flow-shell"><header class="flow-top"><div><a href="profile.html">← Hồ sơ học tập</a><h1>Lịch sử bài tự luận</h1><p class="flow-status">Các bài đã chấm, điểm, tiêu chí và phản hồi được lưu theo tài khoản của bạn.</p></div><a href="lo-trinh-hoc-tap.html">Mở lộ trình →</a></header><section class="flow-card"><div class="flow-actions"><label>Số lượt hiển thị <select id="essay-limit"><option value="10">10 lượt</option><option value="20" selected>20 lượt</option><option value="50">50 lượt</option></select></label><button id="essay-refresh" class="button button-primary" type="button">Tải lại</button></div><p id="essay-status" class="flow-status" role="status">Đang tải lịch sử…</p><div id="essay-history" class="essay-history-list"></div></section></main>
<script src="assets/js/api.js?v=39.0.0"></script><script src="assets/js/ai-autopilot.js?v=39.0.0"></script><script>
(function(){'use strict';const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const date=value=>{if(!value)return 'Không rõ thời gian';const d=new Date(value);return Number.isNaN(d.getTime())?'Không rõ thời gian':d.toLocaleString('vi-VN')};function list(title,values){return `<div><strong>${title}</strong>${Array.isArray(values)&&values.length?`<ul>${values.map(v=>`<li>${esc(typeof v==='string'?v:(v.name?`${v.name}: ${v.comment||v.score||''}`:JSON.stringify(v)))}</li>`).join('')}</ul>`:'<p class="essay-muted">Chưa có dữ liệu.</p>'}</div>`}async function load(){ $('essay-status').textContent='Đang tải lịch sử…';$('essay-history').innerHTML='';try{const result=await HanhTrinhApi.get(`/api/learning/literature/essay/history?limit=${encodeURIComponent($('essay-limit').value)}`);const items=Array.isArray(result?.data)?result.data:Array.isArray(result)?result:[];if(!items.length){$('essay-status').textContent='Chưa có bài tự luận nào được lưu. Khi nộp bài tự luận qua tính năng chấm bài, kết quả sẽ xuất hiện tại đây.';return}$('essay-status').textContent=`Đã tải ${items.length} lượt chấm.`;$('essay-history').innerHTML=items.map(item=>`<article class="essay-attempt"><h2>${esc(item.subjectName||'Bài tự luận')} · Lớp ${esc(item.grade||'—')}</h2><p class="essay-muted">${esc(date(item.createdAt))} · Nguồn chấm: ${esc(item.source||'local')}</p><p class="essay-score">${esc(item.score)}/10</p><strong>Đề bài</strong><p>${esc(item.prompt||'Không cung cấp đề bài')}</p><strong>Bài làm</strong><div class="essay-copy">${esc(item.essay||'')}</div><div class="essay-grid">${list('Tiêu chí',item.criteria)}${list('Điểm mạnh',item.strengths)}${list('Cần cải thiện',item.improvements)}</div>${item.revisedExample?`<details><summary>Ví dụ tham khảo</summary><div class="essay-copy">${esc(item.revisedExample)}</div></details>`:''}${item.feedback?.aiErrors?.length?`<p class="essay-muted">Ghi chú kỹ thuật: ${esc(item.feedback.aiErrors.join(' · '))}</p>`:''}</article>`).join('')}catch(error){$('essay-status').innerHTML=`<span class="essay-error">${esc(error.message||'Không tải được lịch sử. Hãy đăng nhập rồi thử lại.')}</span>`}}$('essay-refresh').addEventListener('click',load);$('essay-limit').addEventListener('change',load);load()})();
</script></body></html>
