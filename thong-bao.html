<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="google-adsense-account" content="ca-pub-2735044868175045">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2735044868175045" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Thông Báo</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Baloo 2', cursive; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .notify-card {
            background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-left: 8px solid #3498db;
            position: relative;
        }
        .notify-card.event { border-left-color: #f1c40f; } /* Màu vàng cho giải đấu */
        .notify-card.warning { border-left-color: #e74c3c; } /* Màu đỏ cho bảo trì */
        
        .notify-title { font-weight: 800; font-size: 1.2rem; color: #2c3e50; margin-bottom: 5px; }
        .notify-date { font-size: 0.8rem; color: #95a5a6; margin-bottom: 10px; }
        .notify-content { color: #34495e; line-height: 1.5; }
        .btn-back { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #3498db; font-weight: bold; }
    </style>
    <link rel="stylesheet" href="modern-ui.css">
  <link rel="stylesheet" href="assets/ui/ui-v11.css">
  <link rel="stylesheet" href="assets/ui/ux-v13.css">
    <link rel="stylesheet" href="assets/platform/legacy-flow.css">
    <link rel="stylesheet" href="assets/css/ai-autopilot.css?v=39.0.0">
</head>
<body data-legacy-flow="notifications">
    <div class="container">
        <h1>🔔 THÔNG BÁO HÀNH TINH</h1>
        <div id="notification-list">
            <p style="text-align: center;">Đang tải thông báo...</p>
        </div>
        <a href="index.html" class="btn-back">⬅️ Quay lại Sảnh Chính</a>
    </div>

    <script>
        async function loadNotifications() {
            const res = await fetch('/api/notifications');
            const payload = await res.json();
            const data = Array.isArray(payload) ? payload : (payload.data?.items || payload.data || []);
            const listDiv = document.getElementById('notification-list');
            listDiv.innerHTML = '';

            if (data.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center">Hiện chưa có thông báo nào mới.</p>';
                return;
            }

            data.forEach(n => {
                const date = new Date(n.date || n.createdAt).toLocaleString('vi-VN');
                const card = document.createElement('div');
                card.className = `notify-card ${n.type}`;
                card.innerHTML = `
                    <div class="notify-title">${n.title}</div>
                    <div class="notify-date">📅 ${date}</div>
                    <div class="notify-content">${n.content || n.message || ''}</div>
                `;
                listDiv.appendChild(card);
            });
        }
        loadNotifications();
    </script>
    <script src="modern-ui.js"></script>
  <script src="assets/ui/ui-v11.js"></script>
  <script src="assets/ui/connection-v13.js"></script>
  <script src="assets/ui/ux-v13.js"></script>

  <script src="assets/platform/legacy-flow.js"></script>
<script src="assets/js/ai-autopilot.js?v=39.0.0"></script>
</body>
</html>
