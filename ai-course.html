<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khóa học AI cá nhân | Hành Trình Mới</title><link rel="stylesheet" href="assets/platform/platform-shell.css"><link rel="stylesheet" href="assets/platform/flow-pages.css"><link rel="stylesheet" href="assets/css/learning/learning-catalog.css?v=39.0.0"><link rel="stylesheet" href="assets/css/ai-autopilot.css?v=39.0.0"><link rel="stylesheet" href="assets/css/ai-v18/course-tools.css"></head>
<body class="flow-page"><main class="flow-shell"><header class="flow-top"><div><a href="index.html">← Learning Hub</a><h1 id="course-title">Khóa học AI</h1><p id="course-description" class="flow-status"></p></div><span class="learning-chip">AI PERSONALIZED</span></header>
<section class="flow-card"><div id="course-meta" class="learning-course-path"></div><div id="course-summary" class="ai-v18-chip-row" style="margin:12px 0"></div><div id="course-lessons" class="ai-course-outline">Đang tải…</div></section>

<script src="assets/js/api.js?v=39.0.0"></script><script src="assets/js/ai-v18/code-playground.js"></script><script>
(()=>{const api=window.HanhTrinhApi,$=id=>document.getElementById(id),setHidden=(id,value)=>{const el=$(id);if(el)el.hidden=Boolean(value)},asList=v=>Array.isArray(v)?v:typeof v==='string'?v.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean):Array.isArray(v?.items)?v.items:Array.isArray(v?.data)?v.data:[],safe=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const id=new URLSearchParams(location.search).get('id');let course,selectedLesson;
function readable(value){const raw=String(value??'').replace(/\r/g,'').trim();if(!raw)return '';const split=text=>{const parts=String(text||'').split(/(?<=[.!?。！？])\s+|(?<=;)\s+/u).map(x=>x.trim()).filter(Boolean),expanded=[];for(const part of parts){if(part.length<=220){expanded.push(part);continue}let buffer='';for(const word of part.split(/\s+/u)){if(buffer&&`${buffer} ${word}`.length>220){expanded.push(buffer);buffer=word}else buffer=`${buffer}${buffer?' ':''}${word}`}if(buffer)expanded.push(buffer)}const grouped=[];let buffer='';for(const part of expanded){if(buffer&&(buffer.length+part.length>255||buffer.split(/(?<=[.!?。！？])\s+/u).length>=2)){grouped.push(buffer);buffer=''}buffer=`${buffer}${buffer?' ':''}${part}`}if(buffer)grouped.push(buffer);return grouped.map((x,i)=>`<article class="learning-content-piece"><small>Ý nhỏ ${i+1}</small><p>${safe(x)}</p></article>`).join('')};const segments=raw.split(/(?=Bước\s+\d+\s*:)/iu);let html='',steps=[];const flush=()=>{if(steps.length){html+=`<ol class="learning-content-steps">${steps.map(item=>{const m=item.match(/^Bước\s+(\d+)\s*:\s*([\s\S]*)$/iu);return `<li><strong>${m?`Bước ${safe(m[1])}`:'Bước'}</strong>${split(m?m[2]:item)}</li>`}).join('')}</ol>`;steps=[]}};for(const part of segments){if(/^Bước\s+\d+\s*:/iu.test(part.trim())){steps.push(part.trim());continue}flush();for(const line of part.split(/\n+/u).map(x=>x.trim()).filter(Boolean))html+=split(line)}flush();return html;}const lessonChapter=lesson=>lesson.payload?.chapterTitle||lesson.generationMetadata?.chapterTitle||'Nội dung học tập';
function assessmentLink(a){return `<a class="button button-secondary" href="assessment.html?id=${encodeURIComponent(a._id)}">${safe(a.title||a.code)} · ${((a.questionIds||[]).length)} câu</a>`}
function render(){const root=$('course-lessons');const groups=new Map();for(const lesson of course.lessons||[]){const key=lessonChapter(lesson);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(lesson)}let html='';let chapterNo=0;for(const [chapter,lessons] of groups){chapterNo++;const chapterAssessment=(course.assessments||[]).find(a=>a.assessmentType==='CHAPTER_TEST'&&String(a.title||'').includes(chapter.replace('Chương ','')));html+=`<section class="learning-grade-block"><header class="learning-grade-head"><div><div class="learning-kicker">CHƯƠNG ${chapterNo}</div><h3>${safe(chapter)}</h3></div><span class="learning-chip">${lessons.length} bài</span></header><div class="learning-unit-list">${lessons.map((lesson,index)=>`<article class="learning-unit"><div class="learning-unit-head"><div><h4>${index+1}. ${safe(lesson.title)}</h4><small>${safe(lesson.difficulty||'Adaptive')} · ${safe(lesson.estimatedMinutes||'—')} phút · ${lesson.lessonTestId?'✅ Test bài':'⚠️ Chưa có test'}</small></div><button class="learning-btn primary" data-lesson="${safe(lesson._id)}">Học bài</button></div></article>`).join('')}</div>${chapterAssessment?`<div class="flow-actions" style="margin-top:12px">${assessmentLink(chapterAssessment)}</div>`:''}</section>`}const mid=(course.assessments||[]).find(a=>a.assessmentType==='MIDTERM'),final=(course.assessments||[]).find(a=>a.assessmentType==='FINAL'),mock=(course.assessments||[]).find(a=>a.assessmentType==='MOCK');if(mid||final||mock)html+=`<section class="ai-v18-card"><h3>📋 Kỳ kiểm tra</h3><div class="ai-v18-lesson-tools">${mid?assessmentLink(mid):''}${final?assessmentLink(final):''}${mock?assessmentLink(mock):''}</div></section>`;root.innerHTML=html||'<p class="flow-status">Chưa có nội dung khóa học.</p>';root.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson));
}
async function openLesson(lessonId){selectedLesson=course.lessons.find(x=>String(x._id)===String(lessonId));if(!selectedLesson)return;setHidden('lesson-panel',false);if($('course-lessons')?.parentElement)$('course-lessons').parentElement.hidden=true;const theory=asList(selectedLesson.theorySections).length?asList(selectedLesson.theorySections).map(x=>`<section class="learning-content-card"><h3>${safe(x.title)}</h3>${readable(x.content)}</section>`).join(''):readable(selectedLesson.theory||'');const lecture=selectedLesson.payload?.lecture||{};const examples=asList(selectedLesson.examples).map(x=>`<li><strong>${safe(x.title||'Ví dụ')}:</strong> ${readable(x.text||x.problem||'')} ${x.solution?`<div class="learning-example-solution"><strong>Lời giải / cách thực hiện</strong>${readable(x.solution)}</div>`:''}</li>`).join('');const practice=asList(selectedLesson.payload?.practiceTasks??selectedLesson.activities).map((x,i)=>`<li><strong>${safe(x.title||`Bài ${i+1}`)}</strong>${readable(x.instruction||x.task||x.description||x.text||String(x))}${x.hint?`<p><strong>Gợi ý:</strong> ${safe(x.hint)}</p>`:''}${x.deliverable?`<p><strong>Sản phẩm cần nộp:</strong> ${safe(x.deliverable)}</p>`:''}</li>`).join('');const mistakes=asList(selectedLesson.payload?.commonMistakes).map(x=>`<li>${safe(x)}</li>`).join('');const audio=selectedLesson.audioAssetId?`<div class="ai-v18-card"><h3>🎧 Bài giảng âm thanh</h3><audio controls preload="none" src="/api/ai-learning/audio/${encodeURIComponent(selectedLesson.audioAssetId)}"></audio></div>`:'<div id="audio-pending" class="ai-v18-card">⏳ AI đang chuẩn bị audio bài giảng…</div>';const image=selectedLesson.payload?.aiImageAssetId?`<img class="ai-v18-image" src="/api/ai-learning/images/${encodeURIComponent(selectedLesson.payload.aiImageAssetId)}" alt="AI illustration">`:'<div id="image-pending" class="ai-v18-card">🖼️ AI đang tạo hình minh họa cho bài…</div>';if(!$('lesson-body'))return;$('lesson-body').innerHTML=`<article class="ai-v18-stack"><div class="learning-content-card"><h2>${safe(selectedLesson.title)}</h2><p>${safe(selectedLesson.description||'')}</p>${lecture.script?`<section class="ai-v18-card"><h3>👨‍🏫 Bài giảng</h3>${readable(lecture.script)}<ul>${asList(lecture.keyPoints).map(x=>`<li>${safe(x)}</li>`).join('')}</ul></section>`:''}${theory}${image}${audio}</div><div class="ai-v18-grid"><article class="ai-v18-card"><h3>💡 Ví dụ</h3><ul>${examples||'<li>AI sẽ bổ sung ví dụ theo nhu cầu cá nhân.</li>'}</ul></article><article class="ai-v18-card"><h3>📝 Bài tập thực hành</h3><ul>${practice||'<li>Hãy hoàn thành hoạt động trong bài trước khi test.</li>'}</ul></article></div><article class="ai-v18-card"><h3>⚠️ Lỗi thường gặp</h3><ul>${mistakes||'<li>AI sẽ học từ lỗi của bạn và bổ sung remedial.</li>'}</ul></article></article><aside class="learning-side-stack"><article class="learning-content-card"><h3>🎯 Mục tiêu</h3><ul>${asList(selectedLesson.objectives).map(x=>`<li>${safe(x)}</li>`).join('')||'<li>AI chưa ghi nhận mục tiêu riêng.</li>'}</ul></article><article class="learning-content-card"><h3>🧠 Kỹ năng</h3><p>${safe(asList(selectedLesson.skills).join(' · ')||'Adaptive')}</p></article><article class="learning-content-card"><h3>📊 Cấu trúc bài</h3><div class="ai-v18-chip-row"><span class="ai-v18-chip">Lý thuyết ✅</span><span class="ai-v18-chip">Bài giảng ✅</span><span class="ai-v18-chip">Ví dụ ✅</span><span class="ai-v18-chip">Bài tập ✅</span><span class="ai-v18-chip">Test ${selectedLesson.lessonTestId?'✅':'⚠️'}</span></div></article></aside>`;const lessonTestLink=$('lesson-test-link');if(lessonTestLink){if(selectedLesson.lessonTestId){lessonTestLink.href=`assessment.html?id=${encodeURIComponent(selectedLesson.lessonTestId)}`;lessonTestLink.removeAttribute('hidden')}else lessonTestLink.setAttribute('hidden','')}
const tools=$('lesson-tools');if(!tools)return;tools.innerHTML='';if(window.HtmCodePlayground)window.HtmCodePlayground.mount(tools,{course:course.course,lesson:selectedLesson});ensureMedia(selectedLesson)}
async function ensureMedia(lesson){try{const media=await api.get(`/api/ai-learning/lessons/${encodeURIComponent(lesson._id)}/media`);if(media.audioAssetId&&!lesson.audioAssetId){lesson.audioAssetId=media.audioAssetId;openLesson(lesson._id);return}if(media.imageAssetId&&!lesson.payload?.aiImageAssetId){lesson.payload=lesson.payload||{};lesson.payload.aiImageAssetId=media.imageAssetId;openLesson(lesson._id);return}if(media.audioStatus!=='READY'||media.imageStatus!=='READY')setTimeout(()=>ensureMedia(lesson),15000)}catch(_){setTimeout(()=>ensureMedia(lesson),20000)}}
if($('back-course'))$('back-course').onclick=()=>{setHidden('lesson-panel',true);if($('course-lessons')?.parentElement)$('course-lessons').parentElement.hidden=false;$('lesson-test-link')?.removeAttribute('hidden');};if($('ai-lesson-btn'))$('ai-lesson-btn').onclick=()=>{setHidden('ai-lesson-panel',false);$('ai-lesson-question')?.focus()};if($('ai-lesson-submit'))$('ai-lesson-submit').onclick=async()=>{const q=$('ai-lesson-question')?.value?.trim()||'';if(!q||!selectedLesson)return;if($('ai-lesson-answer'))$('ai-lesson-answer').textContent='AI đang suy nghĩ…';try{const result=await api.lessonHelp({lessonTitle:selectedLesson.title,theory:selectedLesson.theorySections,examples:selectedLesson.examples,question:q});if($('ai-lesson-answer'))$('ai-lesson-answer').textContent=result.answer||'AI chưa trả lời.'}catch(e){if($('ai-lesson-answer'))$('ai-lesson-answer').textContent=e.message||'Không thể gọi AI.'}};
(async()=>{try{if(!id)throw new Error('Thiếu mã khóa học AI.');course=await api.get(`/api/ai-learning/personal-courses/${encodeURIComponent(id)}`);$('course-title').textContent=course.course.name;$('course-description').textContent=course.course.description||'';$('course-meta').innerHTML=[course.course.educationLevel,course.course.grade?`Lớp ${course.course.grade}`:null,course.course.syllabus?.targetExam,course.course.syllabus?.targetVariant,course.course.difficulty,course.course.estimatedMinutes?`${course.course.estimatedMinutes} phút`:null].filter(Boolean).map(x=>`<span class="learning-chip">${safe(x)}</span>`).join('');const assessments=course.assessments||[];$('course-summary').innerHTML=[`📚 ${course.lessons?.length||0} bài`, `📝 ${assessments.filter(a=>a.assessmentType==='LESSON_TEST').length} test bài`, `📘 ${assessments.filter(a=>a.assessmentType==='CHAPTER_TEST').length} test chương`, `📋 ${assessments.some(a=>a.assessmentType==='MIDTERM')?'1':'0'} giữa kỳ`, `🎓 ${assessments.some(a=>a.assessmentType==='FINAL')?'1':'0'} cuối kỳ`, `🧪 ${assessments.some(a=>a.assessmentType==='MOCK')?'1':'0'} mock test`].map(x=>`<span class="ai-v18-chip">${x}</span>`).join('');render()}catch(e){$('course-lessons').textContent=e.message||'Không tải được khóa học.'}})();})();
