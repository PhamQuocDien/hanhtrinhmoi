<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cờ Caro Online</title><script src="/socket.io/socket.io.js"></script><link rel="stylesheet" href="modern-ui.css"><style>
:root{--cell:30px;--ink:#17233b;--blue:#3267e8;--red:#e6485c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#dfeaff,#f8fbff);font-family:Inter,"Segoe UI",sans-serif;color:var(--ink);overflow-x:hidden}.top{display:flex;align-items:center;gap:12px;padding:12px clamp(10px,3vw,28px);background:#ffffffee;border-bottom:1px solid #dbe5f7;position:sticky;top:0;z-index:20}.top a{text-decoration:none;color:#24458d;font-weight:850}.top h1{margin:0;flex:1;text-align:center;font-size:clamp(1.15rem,4vw,1.7rem)}.level{background:#fff1c8;color:#865c00;border-radius:999px;padding:7px 11px;font-weight:900}.shell{max-width:1280px;margin:auto;padding:16px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.panel,.game{background:white;border:1px solid #dbe5f5;border-radius:21px;box-shadow:0 14px 38px #385a9d1c}.panel{padding:17px;align-self:start}.panel h2{margin:0 0 12px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{border:1px solid #dbe4f4;background:#f5f8ff;border-radius:13px;padding:10px;font-weight:850;cursor:pointer}.mode.active{background:var(--blue);color:white}.room-box{margin-top:14px;padding-top:14px;border-top:1px solid #e3e9f4}.room-box input{width:100%;border:2px solid #d9e3f4;border-radius:12px;padding:10px;text-transform:uppercase;font-weight:800}.buttons{display:grid;gap:8px;margin-top:9px}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:900;cursor:pointer;background:var(--blue);color:white}.btn.green{background:#16a36a}.btn.gray{background:#67748d}.status-card{margin-top:14px;padding:13px;border-radius:14px;background:#f2f6ff;line-height:1.5}.legend{display:flex;gap:12px;margin-top:12px;font-weight:850}.x{color:var(--red)}.o{color:var(--blue)}.game{padding:14px;min-width:0}.game-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.turn{font-weight:900;padding:9px 13px;border-radius:12px;background:#eef3ff}.timer{font-variant-numeric:tabular-nums;font-weight:900;color:#b84152}.board-wrap{max-width:100%;overflow:auto;overscroll-behavior:contain;border-radius:15px;background:#deb989;padding:10px;box-shadow:inset 0 0 0 2px #c49b67}.board{display:grid;grid-template-columns:repeat(20,var(--cell));grid-template-rows:repeat(20,var(--cell));width:max-content;background:#e8c796;border:1px solid #9a7147;touch-action:manipulation}.cell{width:var(--cell);height:var(--cell);border-right:1px solid #9e784f;border-bottom:1px solid #9e784f;display:grid;place-items:center;font-size:calc(var(--cell)*.74);font-weight:950;line-height:1;background:transparent;padding:0;cursor:pointer}.cell:hover{background:#fff3}.cell.win{background:#ffe45d}.help{color:#66728a;font-size:.9rem;margin:10px 0 0}.overlay{position:fixed;inset:0;background:#0d1729cc;z-index:100;display:grid;place-items:center;padding:20px}.modal{width:min(470px,94vw);background:white;border-radius:24px;padding:25px;text-align:center;box-shadow:0 30px 80px #0007}.modal h2{font-size:2rem;margin:0 0 8px}.modal p{color:#62708a}.hidden{display:none!important}.toast{position:fixed;right:16px;bottom:16px;z-index:150;background:#17233b;color:white;padding:13px 17px;border-radius:13px;box-shadow:0 13px 35px #0004}@media(max-width:850px){.shell{grid-template-columns:1fr}.panel{order:2}.game{order:1}.modes{grid-template-columns:repeat(4,1fr)}.mode{font-size:.82rem;padding:9px 5px}}@media(max-width:500px){:root{--cell:24px}.shell{padding:8px}.game{padding:9px}.top{padding:9px}.top h1{font-size:1.1rem}.level{font-size:.8rem}.modes{grid-template-columns:1fr 1fr}}
</style><link rel="stylesheet" href="board-ui-v8.css">

</head><body><header class="top"><a href="choi-co.html">← Đấu trường cờ</a><h1>⭕ Cờ Caro Online ❌</h1><span id="level" class="level">Cấp 1</span></header><main class="shell"><aside class="panel"><h2>Chế độ chơi</h2><div class="modes"><button class="mode active" data-mode="ai">🤖 Máy</button><button class="mode" data-mode="random">⚡ Ghép nhanh</button><button class="mode" data-mode="private">🔐 Phòng riêng</button><button class="mode" data-mode="tournament">🏆 Giải đấu</button></div><div id="ai-tools" class="room-box"><label>Độ khó</label><select id="difficulty" style="width:100%;margin-top:6px;padding:10px;border-radius:12px;border:2px solid #d9e3f4"><option value="easy">Dễ</option><option value="normal" selected>Thường</option><option value="hard">Khó</option></select><div class="buttons"><button id="new-ai" class="btn">Ván mới</button></div></div><div id="online-tools" class="room-box hidden"><input id="room-code" maxlength="40" placeholder="Nhập mã phòng"><div class="buttons"><button id="join-room" class="btn">Vào phòng</button><button id="create-room" class="btn green">Tạo phòng mới</button><button id="find-random" class="btn gray">Tìm đối thủ ngẫu nhiên</button></div></div><div id="status" class="status-card">Bạn đi <b class="x">X</b>. Hãy tạo năm quân liên tiếp.</div><div class="legend"><span class="x">❌ Bạn/X</span><span class="o">⭕ Đối thủ/O</span></div></aside><section class="game"><div class="game-head"><div id="turn" class="turn">Lượt của bạn</div><div id="timer" class="timer">--:--</div></div><div class="board-wrap"><div id="board" class="board"></div></div><p class="help">Trên điện thoại có thể kéo ngang/dọc bàn cờ. Kết quả online được máy chủ xác thực.</p></section></main><div id="result" class="overlay hidden"><div class="modal"><h2 id="result-title">Kết quả</h2><p id="result-text"></p><button id="play-again" class="btn">Chơi lại</button></div></div><div id="toast" class="toast hidden"></div><script>
(()=>{'use strict';const socket=io();const SIZE=20;let board=[],mode='ai',room='',mySymbol='X',myTurn=true,ended=false,level=1,timer=null,timeLeft=0;const $=id=>document.getElementById(id);const query=new URLSearchParams(location.search);const tournamentRoom=query.get('room');
function notify(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(notify.t);notify.t=setTimeout(()=>$('toast').classList.add('hidden'),3000)}function setStatus(text){$('status').textContent=text}function resetBoard(){board=Array.from({length:SIZE},()=>Array(SIZE).fill(null));ended=false;myTurn=mode==='ai';$('result').classList.add('hidden');const root=$('board');root.replaceChildren();for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const b=document.createElement('button');b.className='cell';b.dataset.r=r;b.dataset.c=c;b.ariaLabel=`Hàng ${r+1}, cột ${c+1}`;b.onclick=()=>handleCell(r,c);root.append(b)}renderTurn()}function cell(r,c){return $('board').children[r*SIZE+c]}function draw(r,c,symbol){if(board[r][c])return;board[r][c]=symbol;const el=cell(r,c);el.textContent=symbol==='X'?'×':'○';el.classList.add(symbol.toLowerCase())}function winningLine(r,c,s){const dirs=[[1,0],[0,1],[1,1],[1,-1]];for(const[dr,dc]of dirs){const line=[[r,c]];for(const sign of[-1,1])for(let k=1;k<6;k++){const rr=r+dr*k*sign,cc=c+dc*k*sign;if(rr<0||cc<0||rr>=SIZE||cc>=SIZE||board[rr][cc]!==s)break;line.push([rr,cc])}if(line.length>=5)return line}return null}function finish(title,text,line=[]){ended=true;clearInterval(timer);line.forEach(([r,c])=>cell(r,c).classList.add('win'));$('result-title').textContent=title;$('result-text').textContent=text;$('result').classList.remove('hidden')}
function renderTurn(){if(ended)return;$('turn').textContent=myTurn?'Lượt của bạn':'Đang chờ đối thủ';$('turn').style.background=myTurn?'#e8fff4':'#fff1f2'}function handleCell(r,c){if(ended||board[r][c])return;if(mode==='ai'){if(!myTurn)return;draw(r,c,'X');const line=winningLine(r,c,'X');if(line){finish('🎉 Bạn thắng!','Bạn đã tạo được năm quân liên tiếp.',line);fetch('/api/game/caro-win',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({level,timeTaken:0})}).catch(()=>{});return}myTurn=false;renderTurn();setTimeout(aiMove,260)}else{if(!room||!myTurn)return notify('Chưa đến lượt của bạn.');socket.emit('caroMove',{room,r,c})}}
function aiMove(){if(ended)return;const empty=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!board[r][c])empty.push([r,c]);if(!empty.length)return finish('Hòa','Bàn cờ đã kín.');let choice=findTactical('O')||findTactical('X');if(!choice&&$('difficulty').value==='hard')choice=bestNearby();if(!choice)choice=empty[Math.floor(Math.random()*empty.length)];draw(choice[0],choice[1],'O');const line=winningLine(choice[0],choice[1],'O');if(line)return finish('Máy thắng','Hãy thử chặn các đường có ba hoặc bốn quân.',line);myTurn=true;renderTurn()}function findTactical(symbol){for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!board[r][c]){board[r][c]=symbol;const win=winningLine(r,c,symbol);board[r][c]=null;if(win)return[r,c]}return null}function bestNearby(){let best=null,score=-1;for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!board[r][c]){let s=0;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const v=board[r+dr]?.[c+dc];if(v)s+=v==='O'?3:2}if(s>score){score=s;best=[r,c]}}return best}
function selectMode(next){mode=next;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===next));$('ai-tools').classList.toggle('hidden',next!=='ai');$('online-tools').classList.toggle('hidden',next==='ai');room='';myTurn=next==='ai';resetBoard();setStatus(next==='ai'?'Bạn đi X. Chọn ô để bắt đầu.':'Tạo phòng, nhập mã hoặc ghép nhanh để chơi online.')}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));
$('new-ai').onclick=()=>{level=Math.min(100,level+1);$('level').textContent=`Cấp ${level}`;resetBoard()};$('create-room').onclick=()=>{if(mode!=='private')selectMode('private');socket.emit('createCaroRoom')};$('join-room').onclick=()=>{const code=$('room-code').value.trim().toUpperCase();if(!code)return notify('Hãy nhập mã phòng.');room=code;socket.emit('joinCaroRoom',code)};$('find-random').onclick=()=>{selectMode('random');socket.emit('findMatch','caro');setStatus('Đang tìm đối thủ...')};$('play-again').onclick=()=>{if(mode==='ai')resetBoard();else location.href='caro.html'};
socket.on('roomCreated',code=>{room=code;$('room-code').value=code;setStatus(`Đã tạo phòng ${code}. Gửi mã này cho bạn bè.`);notify(`Mã phòng: ${code}`)});socket.on('waiting',data=>setStatus(data?.message||'Đang chờ đối thủ...'));socket.on('notification',notify);socket.on('matchFound',data=>{room=data.room;mySymbol=data.role;mode=data.isTournament?'tournament':mode==='ai'?'private':mode;resetBoard();myTurn=Boolean(data.yourTurn);renderTurn();setStatus(`Đối thủ: ${data.opponent}. Bạn đi ${mySymbol}.`);if(data.isTournament)startTimer((data.matchDuration||20)*60)});socket.on('caroMoveAccepted',data=>{draw(Number(data.r),Number(data.c),data.symbol);myTurn=data.playerId!==socket.id;renderTurn()});socket.on('turnUpdate',data=>{myTurn=data.nextTurnId===socket.id;renderTurn();if(timeLeft)restartTurnClock()});socket.on('caroGameOver',data=>{if(data.reason==='draw')finish('🤝 Hòa','Hai bên đã lấp đầy bàn cờ.');else{const won=data.winnerId===socket.id;finish(won?'🏆 Bạn thắng!':'Bạn thua',won?'Kết quả đã được máy chủ xác thực.':`${data.winnerName||'Đối thủ'} đã tạo năm quân liên tiếp.`)}});socket.on('playerLeft',()=>finish('Đối thủ đã rời phòng','Ván đấu được dừng để tránh treo phòng.'));socket.on('gameOver',data=>finish(data.winner===localStorage.getItem('currentUser')?'🏆 Bạn thắng!':'Ván đấu kết thúc',data.reason==='timeout'?'Có người hết giờ.':`Người thắng: ${data.winner||'Chưa xác định'}`));
function startTimer(seconds){timeLeft=seconds;restartTurnClock()}function restartTurnClock(){clearInterval(timer);let left=Math.min(120,timeLeft||120);$('timer').textContent=format(left);timer=setInterval(()=>{left--;timeLeft=Math.max(0,timeLeft-1);$('timer').textContent=format(left);if(left<=0){clearInterval(timer);if(myTurn&&room)socket.emit('timeoutLoss',{room,loserUsername:localStorage.getItem('currentUser')})}},1000)}function format(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
resetBoard();if(tournamentRoom){selectMode('tournament');room=tournamentRoom.toUpperCase();$('room-code').value=room;socket.emit('joinCaroRoom',room)}
})();
</script><script src="board-ui-v8.js"></script>
