    // --- CẤP 801-850: Cảm xúc & Tâm lý (Emotions & Psychology - Advanced) ---
    { id: 801, text: 'Understanding your emotions is the first step to controlling them', trans: 'Hiểu cảm xúc của bản thân là bước đầu để kiểm soát chúng' },
    { id: 802, text: 'She felt a sudden wave of happiness when she saw him', trans: 'Cô ấy cảm thấy một làn sóng hạnh phúc bất chợt khi nhìn thấy anh ấy' },
    { id: 803, text: 'It is important to express your feelings honestly and respectfully', trans: 'Điều quan trọng là bày tỏ cảm xúc một cách trung thực và tôn trọng' },
    { id: 804, text: 'Anxiety can sometimes prevent us from reaching our full potential', trans: 'Sự lo âu đôi khi ngăn cản chúng ta đạt được tiềm năng tối đa' },
    { id: 805, text: 'Building self confidence takes time and patience', trans: 'Xây dựng sự tự tin cần thời gian và sự kiên nhẫn' },

    { id: 807, text: 'Depression is a serious condition that requires professional help', trans: 'Trầm cảm là một tình trạng nghiêm trọng cần sự giúp đỡ chuyên nghiệp' },

    { id: 810, text: 'Empathy allows us to connect with others on a deeper level', trans: 'Sự thấu cảm cho phép ta kết nối với người khác ở mức độ sâu sắc hơn' },
    { id: 811, text: 'Do not let the fear of failure stop you from trying', trans: 'Đừng để nỗi sợ thất bại ngăn cản bạn cố gắng' },

    { id: 849, text: 'You are stronger than you think', trans: 'Bạn mạnh mẽ hơn bạn nghĩ đấy' },

    { id: 853, text: 'Climate change is the biggest threat facing humanity today', trans: 'Biến đổi khí hậu là mối đe dọa lớn nhất nhân loại đang đối mặt' },

    { id: 871, text: 'Immigration policies are being debated by the government', trans: 'Các chính sách nhập cư đang được chính phủ tranh luận' },
    { id: 872, text: 'Homelessness requires long term solutions not just temporary aid', trans: 'Vô gia cư cần giải pháp dài hạn chứ không chỉ viện trợ tạm thời' },

    { id: 874, text: 'Public transportation helps reduce traffic congestion', trans: 'Giao thông công cộng giúp giảm thiểu tắc nghẽn giao thông' },

    { id: 880, text: 'Technology can be a double edged sword', trans: 'Công nghệ có thể là con dao hai lưỡi' },

        async function init() {
            try {
                const res = await fetch('/api/user/progress');
                if (res.ok) {
                    const data = await res.json();
                    unlockedLevel = data.englishSpeechLevel || 1;
                }
            } catch(e) {}
            renderLevels();
        }

        function renderLevels() {
            const list = document.getElementById('level-buttons');
            list.innerHTML = '';
            levels.forEach(lvl => {
                const btn = document.createElement('button');
                const icon = lvl.id <= unlockedLevel ? lvl.id : '🔒';
                btn.innerHTML = `<span>${icon}</span>`;
                btn.className = `level-btn ${lvl.id <= unlockedLevel ? 'unlocked' : ''} ${lvl.id === unlockedLevel ? 'current' : ''}`;
                
                if (lvl.id <= unlockedLevel) {
                    btn.onclick = () => startGame(lvl.id);
                } else {
                    btn.disabled = true;
                }
                list.appendChild(btn);

                if (lvl.id === unlockedLevel) {
                    setTimeout(() => {
                        btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 500);
                }
            });
        }

        function speakSample() {
            const text = document.getElementById('text-to-read').textContent;
            const btnRecord = document.getElementById('record-btn');

            if (btnRecord.classList.contains('recording') && recognition) {
                recognition.abort();
                btnRecord.classList.remove('recording');
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;

            utterance.onstart = () => {
                btnRecord.disabled = true; 
                btnRecord.style.opacity = "0.3";
                btnRecord.style.cursor = "not-allowed";
                document.getElementById('score-display').textContent = "";
                document.getElementById('result-text').textContent = "🤫 Trật tự nghe máy đọc nhé...";
            };

            utterance.onend = () => {
                btnRecord.disabled = false;
                btnRecord.style.opacity = "1";
                btnRecord.style.cursor = "pointer";
                document.getElementById('result-text').textContent = "Giờ đến lượt bé đọc nào!";
            };

            window.speechSynthesis.speak(utterance);
        }

        function startGame(id) {
            currentLevel = id;
            const data = levels.find(l => l.id === id);
            window.speechSynthesis.cancel(); 

            document.getElementById('level-selection-area').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            
            document.getElementById('level-title').textContent = `LEVEL ${id}`;
            document.getElementById('text-to-read').textContent = data.text;
            document.getElementById('text-translation').textContent = data.trans;

            resetGameUI();
            setTimeout(speakSample, 600); 
        }

        function resetGameUI() {
            document.getElementById('result-text').textContent = "Nhấn vào micro và đọc to nhé!";
            document.getElementById('score-display').textContent = "";
            document.getElementById('record-btn').classList.remove('recording');
            document.getElementById('result-container').style.background = "transparent";
        }

        // --- THUẬT TOÁN SO SÁNH ---
        function editDistance(s1, s2) {
            s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function similarity(s1, s2) {
            let longer = s1, shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function checkResult(spoken) {
            const targetObj = levels.find(l => l.id === currentLevel);
            if (!targetObj) return; 
            const target = targetObj.text;

            const normalize = (str) => {
                return str.toLowerCase()
                    .replace(/[^a-z0-9\s]/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();
            };

            const cleanSpoken = normalize(spoken);
            const cleanTarget = normalize(target);

            const accuracy = similarity(cleanSpoken, cleanTarget);
            const percent = Math.round(accuracy * 100);
            
            const scoreDisplay = document.getElementById('score-display');
            const resultContainer = document.getElementById('result-container');

            if (percent >= 87) {
                scoreDisplay.innerHTML = `🎉 CHÍNH XÁC! (${percent}%) 🎉`;
                scoreDisplay.style.color = "#27ae60";
                resultContainer.style.background = "#dff9fb";
                saveWin(); 
            } else {
                scoreDisplay.innerHTML = `Chưa đạt (${percent}%). Cần 87% để qua màn! 😅`;
                scoreDisplay.style.color = "#d63031";
                resultContainer.style.background = "#ffeaa7";
            }
        }

        async function saveWin() {
            if (currentLevel === unlockedLevel && unlockedLevel < 1000) unlockedLevel++;
            try {
                const res = await fetch('/api/game/english-speech-win', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ level: currentLevel })
                });
                const d = await res.json();
                if(d.newLevel) unlockedLevel = d.newLevel;
                setTimeout(() => document.getElementById('back-to-levels-btn').click(), 2000);
            } catch(e) {}
        }

        // --- XỬ LÝ SỰ KIỆN GHI ÂM ---
        const recordBtn = document.getElementById('record-btn');
        recordBtn.addEventListener('click', () => {
            if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
                window.speechSynthesis.cancel();
            }

            if (!recognition) return alert("Trình duyệt không hỗ trợ!");

            if (recordBtn.classList.contains('recording')) {
                recognition.stop();
                recordBtn.classList.remove('recording');
            } else {
                document.getElementById('score-display').textContent = "";
                document.getElementById('result-container').style.background = "transparent";
                document.getElementById('result-text').textContent = "Đang nghe... Bé đọc đi nào!";

                try {
                    recognition.start();
                    recordBtn.classList.add('recording');
                } catch (e) {
                    console.error("Lỗi khởi động Recognition:", e);
                    recordBtn.classList.remove('recording');
                }
            }
        });

        if (recognition) {
            recognition.onresult = (event) => {
                recordBtn.classList.remove('recording');
                const spoken = event.results[0][0].transcript;
                document.getElementById('result-text').textContent = `Bé đã nói: "${spoken}"`;
                checkResult(spoken);
            };

            recognition.onerror = (event) => {
                recordBtn.classList.remove('recording');
                if (event.error !== 'no-speech') {
                    document.getElementById('result-text').textContent = "Không nghe rõ, bé thử lại nhé!";
                }
            };

            recognition.onspeechend = () => {
                recognition.stop();
                recordBtn.classList.remove('recording');
            };
        }

        document.getElementById('back-to-levels-btn').addEventListener('click', () => {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('level-selection-area').style.display = 'block';
            renderLevels();
        });

        init();
    </script>
