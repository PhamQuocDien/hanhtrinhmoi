<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="google-adsense-account" content="ca-pub-2735044868175045">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2735044868175045" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <title>Tỷ Phú Thiên Hà 2D - Hành Tinh Mơ Ước</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #1a1a2e; --board-bg: #dfe6e9; --primary: #e94560; --accent: #f1c40f; }
        body { margin: 0; font-family: 'Nunito', sans-serif; background: var(--bg); color: white; display: flex; min-height: 100svh; overflow: hidden; flex-direction: row; }
        #home-link{position:fixed;left:12px;top:12px;z-index:9000;background:#ffffffdd;color:#24324a;text-decoration:none;padding:9px 12px;border-radius:12px;font-weight:900;box-shadow:0 5px 18px #0004}

        /* --- BÀN CỜ 2D SIÊU MƯỢT --- */
        .game-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 5px; }
        #main-board {
            display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
            width: min(92vh, 92vw); height: min(92vh, 92vw);
            background: #2d3436; border: 6px solid #636e72; gap: 2px; position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .tile { background: var(--board-bg); border: 1px solid #b2bec3; display: flex; flex-direction: column; align-items: center; position: relative; color: #2d3436; transition: 0.2s; }
        .tile:hover { filter: brightness(1.05); }
        .tile-header { height: 20%; width: 100%; margin-bottom: 2px; box-shadow: inset 0 -2px 5px rgba(0,0,0,0.1); }
        .tile-name { font-size: clamp(0.3rem, 0.9vh, 0.65rem); font-weight: 800; text-align: center; line-height: 1.2; padding: 0 2px; }
        .tile-price { font-size: clamp(0.3rem, 0.8vh, 0.55rem); color: #d35400; margin-top: auto; font-weight: 900; padding-bottom: 2px; }

        .center-area {
            grid-column: 2 / 11; grid-row: 2 / 11;
            background: radial-gradient(circle, #16213e, #0a0a1a);
            display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid #34495e;
            position: relative; overflow: hidden;
        }

        /* --- QUÂN CỜ (TOKEN) --- */
        .token-container { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; pointer-events: none; padding-bottom: 2px; }
        .player-token { font-size: 1.5rem; filter: drop-shadow(2px 2px 2px black); transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); margin: -3px; z-index: 5; }
        .player-token.in-jail { filter: grayscale(1) sepia(1) hue-rotate(-50deg); }

        /* --- NHÀ & KHÁCH SẠN --- */
        .house-indicator { position: absolute; top: 22%; width: 100%; text-align: center; font-size: 0.85rem; pointer-events: none; z-index: 2; }

        /* --- SIDEBAR --- */
        .sidebar { width: 320px; background: rgba(22, 33, 62, 0.98); padding: 15px; display: flex; flex-direction: column; border-left: 4px solid var(--primary); box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        .player-card { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; margin-bottom: 8px; border-left: 6px solid transparent; transition: 0.3s; position: relative; }
        .player-card.active { background: rgba(255,255,255,0.15); border-color: var(--accent); transform: translateX(-5px); box-shadow: 0 0 15px rgba(241, 196, 15, 0.3); }

        .log-box { flex: 1; background: rgba(0,0,0,0.5); margin-top: 15px; border-radius: 12px; padding: 12px; font-size: 0.8rem; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }

        .btn-modern { width: 100%; padding: 14px; border-radius: 10px; border: none; font-family: 'Fredoka One'; cursor: pointer; transition: 0.2s; text-transform: uppercase; margin-top: 8px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .btn-modern:active { transform: translateY(3px); box-shadow: none; }
        #roll-btn { background: var(--primary); color: white; font-size: 1.2rem; }
        #roll-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* --- MODALS --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px); }
        .modal-content { background: white; color: #333; padding: 30px; border-radius: 25px; max-width: 350px; width: 90%; text-align: center; border: 5px solid var(--primary); }
        .hidden { display: none !important; }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow:auto; }
            .game-container { min-height: min(72svh, 100vw); padding-top:52px; align-items:flex-start; }
            #main-board { width:min(96vw,68svh); height:min(96vw,68svh); border-width:3px; gap:1px; }
            .sidebar { width: 100%; min-height: 250px; height:auto; border-left: none; border-top: 4px solid var(--primary); flex-direction:column; padding:10px; }
            .sidebar h2 { display:none; }
            #player-stats { display:flex; gap:8px; overflow-x:auto; flex:none; padding-bottom:5px; }
            .player-card { min-width:140px; margin-bottom:0; transform:none!important; }
            .controls { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:100%; padding:0; }
            .controls .btn-modern { margin-top:4px; padding:11px 5px; font-size:.78rem; }
            .log-box { min-height:100px; max-height:150px; display:block; order:3; }
            .tile-name { font-size:clamp(.22rem,1.3vw,.52rem); }
            .tile-price { font-size:clamp(.2rem,1.15vw,.45rem); }
            .player-token { font-size:1rem; }
        }
        @media(max-width:480px){.center-area h1{font-size:2.8rem!important}.center-area p{font-size:.75rem!important}.modal-content{padding:20px}.house-indicator{font-size:.55rem}}

        .dice-anim { animation: roll 0.6s ease-out; }
        @keyframes roll { 0% { transform: scale(0.5) rotate(0deg); opacity: 0; } 50% { transform: scale(1.2) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); opacity: 1; } }
    </style>
    <link rel="stylesheet" href="modern-ui.css">
<link rel="stylesheet" href="board-ui-v8.css">
  <link rel="stylesheet" href="assets/ui/ui-v11.css">
  <link rel="stylesheet" href="assets/ui/ux-v13.css">
  <link rel="stylesheet" href="board-ui-v14.css">
</head>
<body>
<a id="home-link" href="choi-co.html">← Đấu trường cờ</a>

<div class="game-container">
    <div id="main-board">
        <div class="center-area">
            <div id="dice-container" style="display: flex; gap: 15px;">
                <h1 id="dice-display" style="font-size: 4.5rem; margin: 0; text-shadow: 0 0 20px white;">🎲</h1>
            </div>
            <p id="turn-status" style="color: var(--accent); font-weight: 800; font-size: 1.2rem; margin-top: 10px; font-family: 'Fredoka One'; letter-spacing: 1px;"></p>
        </div>
    </div>
</div>

<div class="sidebar">
    <h2 style="font-family: 'Fredoka One'; text-align: center; color: var(--accent); margin: 0 0 15px 0;">GALAXY TYCOON</h2>
    <div id="player-stats"></div>
    <div class="log-box" id="game-logs"></div>
    <div class="controls">
        <button id="roll-btn" class="btn-modern" onclick="rollDice()" disabled>TUNG XÚC XẮC 🎲</button>
        <button id="build-btn" class="btn-modern" style="background: var(--accent); display: none;" onclick="requestBuild()">XÂY NHÀ 🏗️</button>
        <button id="end-turn-btn" class="btn-modern" style="background: #2ecc71; color:white; display: none;" onclick="endTurn()">XONG LƯỢT ✅</button>
    </div>
</div>

<div id="start-modal" class="modal-overlay">
    <div class="modal-content">
        <h1 style="color: var(--primary); font-family: 'Fredoka One'; margin-bottom: 20px;">CỜ TỶ PHÚ 2D</h1>
        <div id="entry-btns">
            <button class="btn-modern" style="background: var(--primary); color: white;" onclick="createRoom()">TẠO PHÒNG MỚI</button>
            <div style="margin: 15px 0; display: flex; gap: 5px;">
                <input type="text" id="join-input" placeholder="Mã phòng..." style="flex: 1; padding: 12px; text-align: center; border-radius: 10px; border: 2px solid #ddd; font-weight: bold;">
                <button onclick="joinRoom()" style="padding: 0 20px; background: #3498db; color:white; border:none; border-radius:10px; cursor:pointer; font-weight: bold;">VÀO</button>
            </div>
            <button class="btn-modern" style="background: #e67e22; color: white;" onclick="findMatch()">GHÉP TỰ ĐỘNG</button>
        </div>
        <div id="lobby-info" class="hidden">
            <p style="font-size: 1.1rem;">PHÒNG: <b id="room-code-display" style="color: #3498db; font-size: 1.5rem;">-</b></p>
            <div id="lobby-players" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px 0;"></div>
            <button id="start-btn" class="btn-modern" style="background: #2ecc71; color: white; display:none;" onclick="startGame()">BẮT ĐẦU 🚀</button>
            <p id="waiting-msg" style="color: #888; font-style: italic; font-size: 0.9rem;">Đang đợi các bạn khác vào...</p>
        </div>
    </div>
</div>

<div id="auction-modal" class="modal-overlay hidden">
    <div class="modal-content" style="background: #2c3e50; color: white; border-color: var(--accent);">
        <h2 style="color: var(--accent); font-family: 'Fredoka One';">🔨 ĐẤU GIÁ TÀI SẢN</h2>
        <p id="auction-item-name" style="font-weight: bold; font-size: 1.2rem;"></p>
        <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; margin: 15px 0;">
            <h1 id="current-bid" style="font-size: 3rem; margin: 0; color: var(--accent);">$0</h1>
            <p id="highest-bidder" style="margin: 5px 0 0 0; color: #00b894;">Chưa ai trả giá</p>
        </div>
        <div id="auction-timer" style="font-size: 1.8rem; color: var(--primary); font-weight: 800;">10s</div>
        <button class="btn-modern" style="background: #2ecc71; color: white; margin-top: 20px;" onclick="placeBid()">TRẢ GIÁ +$20 💰</button>
    </div>
</div>

<div id="result-modal" class="modal-overlay hidden"><div class="modal-content"><h2 id="result-title">Kết thúc ván</h2><p id="result-message"></p><button class="btn-modern" style="background:#3498db;color:white" onclick="location.reload()">CHƠI LẠI</button></div></div>

<div id="buy-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 style="color: #2ecc71; font-family: 'Fredoka One';">MUA THIÊN THẠCH?</h2>
        <p id="buy-msg" style="font-weight: bold; font-size: 1.1rem; line-height: 1.4;"></p>
        <div style="display: flex; gap: 12px; margin-top: 20px;">
            <button class="btn-modern" style="background: #2ecc71; color:white; flex:1" onclick="confirmBuy(true)">MUA 💎</button>
            <button class="btn-modern" style="background: #95a5a6; color:white; flex:1" onclick="confirmBuy(false)">BỎ QUA</button>
        </div>
    </div>
</div>

<script src="monopoly-data.js"></script>
<script>
    const socket = io();
    let myId = null, roomCode = null, currentTurnId = null, currentPos = 0, currentBid = 0, playersData = [];
    const safeText = value => String(value ?? '');
    function showToast(message) { const el = document.getElementById('game-toast'); el.textContent = message; el.style.display='block'; clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>el.style.display='none',3000); }
    function renderPlayers() {
        const root=document.getElementById('player-stats'); root.replaceChildren();
        playersData.forEach(p=>{ const card=document.createElement('div'); card.className='player-card'+(p.id===currentTurnId?' active':''); card.style.borderLeftColor=p.color||'#fff'; const name=document.createElement('b'); name.textContent=`${safeText(p.username)} ${p.inJail||p.isJailed?'⛓️':''}`; const money=document.createElement('div'); money.textContent=`💰 $${Number(p.money||0).toLocaleString('vi-VN')}`; money.style.color='#f1c40f'; money.style.fontWeight='800'; card.append(name,money); root.append(card); });
    }
    function appendLogs(logs=[]) { const box=document.getElementById('game-logs'); logs.forEach(log=>{ const row=document.createElement('div'); row.style.padding='4px 0'; row.style.borderBottom='1px solid rgba(255,255,255,.06)'; row.textContent=safeText(log); box.prepend(row); }); while(box.children.length>80) box.lastChild.remove(); }


    socket.on('connect', () => { myId = socket.id; });

    // --- 1. SETUP BÀN CỜ ---
    function initBoard() {
        const board = document.getElementById('main-board');
        boardData.forEach((cell, i) => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.id = `tile-${i}`;
            if (i <= 10) { tile.style.gridRow = 11; tile.style.gridColumn = 11 - i; }
            else if (i <= 20) { tile.style.gridColumn = 1; tile.style.gridRow = 11 - (i - 10); }
            else if (i <= 30) { tile.style.gridRow = 1; tile.style.gridColumn = i - 20 + 1; }
            else { tile.style.gridColumn = 11; tile.style.gridRow = i - 30 + 1; }
            
            tile.innerHTML = `
                <div class="tile-header" style="background:${cell.color || '#dfe6e9'}"></div>
                <div class="house-indicator" id="houses-${i}"></div>
                <div class="tile-name">${cell.name}</div>
                <div class="tile-price">${cell.price ? '$'+cell.price : ''}</div>
                <div class="token-container" id="tokens-${i}"></div>
            `;
            board.appendChild(tile);
        });
    }

    // --- 2. PHÒNG & SẢNH ---
    function createRoom() { socket.emit('createMonopolyRoom'); }
    function joinRoom() { 
        const c = document.getElementById('join-input').value.trim().toUpperCase();
        if(c) socket.emit('joinMonopolyRoom', c); 
    }
    function findMatch() { socket.emit('findMonopolyMatch'); }
    function startGame() { socket.emit('startMonopoly', roomCode); }

    socket.on('lobbyUpdate', (data) => {
        roomCode = data.roomId;
        document.getElementById('room-code-display').innerText = data.roomId;
        document.getElementById('entry-btns').classList.add('hidden');
        document.getElementById('lobby-info').classList.remove('hidden');
        const lobbyPlayers=document.getElementById('lobby-players'); lobbyPlayers.replaceChildren();
        data.players.forEach(p=>{const chip=document.createElement('div');chip.style.cssText=`background:${/^#[0-9a-f]{6}$/i.test(p.color||'')?p.color:'#52637e'};padding:8px 15px;border-radius:20px;color:white;font-weight:bold;border:2px solid white;box-shadow:0 4px 8px rgba(0,0,0,.2)`;chip.textContent=p.username;lobbyPlayers.append(chip);});
        document.getElementById('start-btn').style.display = (myId === data.hostId) ? 'block' : 'none';
    });

    // --- 3. GAMEPLAY ---
    socket.on('monopolyUpdate', (data) => {
        document.getElementById('start-modal').classList.add('hidden');
        playersData = data.players;

        // Cập nhật thẻ người chơi
        renderPlayers();

        // Cập nhật vị trí Token & Nhà
        boardData.forEach((_, i) => {
            document.getElementById(`tokens-${i}`).innerHTML = '';
            document.getElementById(`houses-${i}`).innerHTML = '';
        });

        data.players.forEach(p => {
            const token = document.createElement('span');
            token.className = `player-token ${p.inJail ? 'in-jail' : ''}`;
            token.style.color = p.color;
            token.innerHTML = p.inJail ? '⛓️' : '🚀';
            document.getElementById(`tokens-${p.position}`).appendChild(token);
        });

        if(data.propertyHouses) {
            Object.entries(data.propertyHouses).forEach(([id, count]) => {
                const h = document.getElementById(`houses-${id}`);
                if(count >= 5) h.innerHTML = '🏨';
                else if(count > 0) h.innerHTML = '<span style="color:#e67e22">' + '🏠'.repeat(count) + '</span>';
            });
        }

        if(data.logs) appendLogs(data.logs);
    });

    socket.on('turnChanged', (data) => {
        currentTurnId = data.turn;
        const isMe = (myId === data.turn);
        document.getElementById('roll-btn').disabled = !isMe;
        document.getElementById('turn-status').innerText = isMe ? "LƯỢT CỦA BÉ! 🌟" : "ĐANG ĐỢI BẠN... ⏳";
        renderPlayers();
        document.getElementById('end-turn-btn').style.display = 'none';
        document.getElementById('build-btn').style.display = 'none';
    });

    socket.on('diceRolled', (d) => {
        const dd = document.getElementById('dice-display');
        dd.classList.add('dice-anim');
        setTimeout(() => { 
            dd.classList.remove('dice-anim'); 
            dd.innerText = `🎲 ${d.d1} + ${d.d2}`; 
        }, 600);
    });

    socket.on('askBuyProperty', (pos) => {
        currentPos = pos;
        document.getElementById('buy-msg').innerText = `Bé muốn mua ${boardData[pos].name} với giá $${boardData[pos].price} không?`;
        document.getElementById('buy-modal').classList.remove('hidden');
    });

    socket.on('enableEndTurn', () => {
        if(myId === currentTurnId) {
            document.getElementById('end-turn-btn').style.display = 'block';
            const me = playersData.find(p => p.id === myId);
            if (me) {
                const tile = boardData[me.position];
                if (tile && tile.type === 'property') {
                    currentPos = me.position;
                    document.getElementById('build-btn').style.display = 'block';
                }
            }
        }
    });

    // --- 4. ĐẤU GIÁ ---
    socket.on('auctionStarted', (data) => {
        document.getElementById('auction-modal').classList.remove('hidden');
        document.getElementById('auction-item-name').innerText = data.tile.name;
        currentBid = data.auction.highestBid;
    });

    socket.on('auctionUpdate', (data) => {
        currentBid = data.highestBid;
        document.getElementById('current-bid').innerText = "$" + data.highestBid;
        document.getElementById('highest-bidder').innerText = "Người trả giá: " + (data.highestBidder || "Chưa có");
    });

    socket.on('auctionTimer', (t) => { document.getElementById('auction-timer').innerText = t + "s"; });
    socket.on('auctionEnded', () => { document.getElementById('auction-modal').classList.add('hidden'); });

    // --- 5. KẾT THÚC ---
    socket.on('monopolyGameOver', (data) => {
        boardNotice(`🏁 Trận đấu kết thúc! Quán quân: ${data.winner}. Bé nhận được ${data.newScore} 💎`,4200);
        setTimeout(()=>location.reload(),4300);
    });

    // --- 6. ACTIONS ---
    function placeBid() { socket.emit('placeBid', { roomId: roomCode, bidAmount: currentBid + 20 }); }
    function rollDice() { if(!roomCode)return; document.getElementById('roll-btn').disabled=true; socket.emit('rollDice', roomCode); }
    function endTurn() { socket.emit('endTurn', roomCode); }
    function confirmBuy(c) {
        document.getElementById('buy-modal').classList.add('hidden');
        if(c) socket.emit('buyProperty', { roomId: roomCode, choice: true });
        else socket.emit('startAuction', { roomId: roomCode, tileId: currentPos });
    }
    function requestBuild() { socket.emit('buildHouse', { roomId: roomCode, tileId: currentPos }); }

    socket.on('errorMsg', m => showToast('❌ '+m));
    socket.on('notification', m => showToast('📢 '+m));
    socket.on('buildSuccess', showToast);

    initBoard();
</script>
    <script src="board-ui-v8.js"></script>
<script src="board-ui-v14.js"></script>
<script src="modern-ui.js"></script>
<div id="game-toast" style="position:fixed;right:15px;bottom:15px;z-index:10000;background:white;color:#26334b;padding:12px 16px;border-radius:12px;box-shadow:0 10px 35px #0007;display:none"></div>
  <script src="assets/ui/ui-v11.js"></script>
  <script src="assets/ui/connection-v13.js"></script>
  <script src="assets/ui/ux-v13.js"></script>
</body>
</html>
