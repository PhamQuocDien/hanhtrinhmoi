    <style>
        .profile-container {
            max-width: 1200px; margin: 20px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .header-info { text-align: center; border-bottom: 2px dashed #ccc; padding-bottom: 20px; margin-bottom: 30px; }
        .avatar { font-size: 5rem; display: block; margin-bottom: 10px; animation: bounce 2s infinite; }
        .username { color: #e67e22; margin: 0; font-size: 2.5rem; text-shadow: 2px 2px 0 #f1c40f; }
        .score-tag { background: #2ecc71; color: white; padding: 5px 20px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; display: inline-block; margin-top: 10px; box-shadow: 0 3px 0 #27ae60; }

        /* Style cho từng tủ cúp */
        .trophy-section { margin-bottom: 40px; background: #fdfdfd; padding: 15px; border-radius: 15px; border: 1px solid #eee; }
        .trophy-header { 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px;
        }
        .trophy-header h2 { margin: 0; color: #2c3e50; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .current-level-tag { background: #3498db; color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.9rem; }

        .trophy-shelf {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .trophy-item {
            background: #f1f2f6; border: 2px solid #bdc3c7;
            border-radius: 8px; padding: 8px; text-align: center;
            opacity: 0.4; filter: grayscale(100%); transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        
        .trophy-item.unlocked {
            opacity: 1; filter: grayscale(0%);
            background: linear-gradient(135deg, #ffffff 0%, #fff9c4 100%); 
            border-color: #f1c40f; transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(241, 196, 15, 0.3);
        }

        .trophy-icon { font-size: 2rem; display: block; margin-bottom: 5px; }
        .trophy-title { font-weight: bold; color: #333; font-size: 0.8rem; line-height: 1.2; height: 32px; display: flex; align-items: center; justify-content: center; }
        .trophy-req { font-size: 0.7rem; color: #7f8c8d; margin-top: 5px; }
        .trophy-item.unlocked .trophy-req { color: #27ae60; font-weight: bold; }

        /* Bảng xếp hạng */
        .leaderboard-section { background: #fffbe6; padding: 25px; border-radius: 15px; border: 3px solid #f1c40f; margin-top: 50px; }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 10px; overflow: hidden; }
        .leaderboard-table th { background: #f1c40f; color: #333; padding: 12px; }
        .leaderboard-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-weight: bold; }
        .top-1 { color: #d35400; background: #fff4d1; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
/* --- STYLE CHO THÔNG BÁO (Mới thêm) --- */
    .match-notification {
        position: fixed; top: 20px; right: 20px; width: 320px;
        background: white; border-left: 10px solid #f1c40f;
        padding: 20px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        z-index: 10001; animation: slideIn 0.5s ease-out forwards; color: #333; font-family: 'Baloo 2', cursive;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .notif-btn { width: 100%; margin-top: 10px; background: #2ecc71; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        const notif = document.createElement('div');
        notif.className = 'match-notification';
        notif.innerHTML = `
            <h3 style="margin:0; color:#e67e22;">${data.title}</h3>
            <p style="margin:10px 0; font-size:0.9rem;">${data.message}</p>
            <button class="notif-btn" onclick="window.location.href='giai-dau.html'">🏟️ ĐẾN SÂN VẬN ĐỘNG</button>
        `;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 300000);
    });

            <p style="margin:10px 0; font-weight: bold;">${data.message}</p>
            <button class="notif-btn" style="background:#8e44ad" onclick="this.parentElement.remove()">ĐÃ HIỂU</button>
        `;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 300000);
    });

        async function loadAllData() {
            try {
                // 1. Tải thông tin người dùng
                const res = await fetch('/api/user/progress');
                if (res.status === 401) {
                    document.getElementById('display-name').textContent = "Khách (Chưa đăng nhập)";
                    return;
                }
                const userData = await res.json();
                
                // Hiển thị tên
                const role = localStorage.getItem('role');
                const childrenRaw = localStorage.getItem('children');
                let displayName = userData.username;
                if (role === 'parent' && childrenRaw) {
                    try {
                        const children = JSON.parse(childrenRaw);
                        if (children.length > 0) displayName = `${userData.username} (PH của: ${children.join(', ')})`;
                    } catch (e) {}
                }
                document.getElementById('display-name').textContent = displayName;
                document.getElementById('display-score').textContent = (userData.score || 0).toLocaleString();

                // 2. Render tất cả tủ cúp
                const container = document.getElementById('all-trophies-container');
                container.innerHTML = ''; // Xóa cũ

                for (const [gameKey, config] of Object.entries(GAME_TITLES)) {
                    const currentLvl = userData[config.key] || 1;
                    
                    // Tạo khung tủ cúp cho game này
                    const section = document.createElement('div');
                    section.className = 'trophy-section';
                    section.innerHTML = `
                        <div class="trophy-header">
                            <h2>${config.icon} ${config.name}</h2>
                            <div class="current-level-tag">Hiện tại: Cấp ${currentLvl}</div>
                        </div>
                        <div class="trophy-shelf" id="shelf-${gameKey}"></div>
                    `;
                    container.appendChild(section);

                    // Điền 10 cúp vào tủ
                    const shelf = section.querySelector(`#shelf-${gameKey}`);
                    config.titles.forEach((title, index) => {
                        const reqLevel = (index + 1) * 10; // Cấp 10, 20, 30... 100
                        const isUnlocked = currentLvl >= reqLevel;
                        
                        const item = document.createElement('div');
                        item.className = `trophy-item ${isUnlocked ? 'unlocked' : ''}`;
                        item.innerHTML = `
                            <span class="trophy-icon">${isUnlocked ? '🏆' : '🔒'}</span>
                            <div class="trophy-title">${title}</div>
                            <div class="trophy-req">${isUnlocked ? 'Đã đạt!' : `Cần cấp ${reqLevel}`}</div>
                        `;
                        shelf.appendChild(item);
                    });
                }

                // 3. Tải bảng xếp hạng
                const resLb = await fetch('/api/leaderboard');
                const topUsers = await resLb.json();
                renderLeaderboard(topUsers);

            } catch (err) { console.error(err); }
        }

        function renderLeaderboard(users) {
            const body = document.getElementById('leaderboard-body');
            body.innerHTML = '';
            users.forEach((user, index) => {
                const row = document.createElement('tr');
                if (index === 0) row.className = 'top-1';
                
                let rank = index + 1;
                if (index === 0) rank = '🥇'; else if (index === 1) rank = '🥈'; else if (index === 2) rank = '🥉';

                row.innerHTML = `
                    <td>${rank}</td>
                    <td>${user.username}</td>
                    <td style="color: #27ae60;">${user.score.toLocaleString()}</td>
                    <td>Cấp ${user.chessLevel || 1}</td>
                `;
                body.appendChild(row);
            });
        }

        loadAllData();
