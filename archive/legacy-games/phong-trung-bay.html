<html lang="vi">
<head>

    <meta charset="UTF-8">

    <title>Phòng Trưng Bày Lưu Niệm</title>

    <style>
        /* --- CẤU HÌNH GIAO DIỆN CHUNG --- */
        body {
            background: #2c3e50; /* Màu nền tối sang trọng */
            font-family: 'Baloo 2', cursive; color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            padding-bottom: 80px; /* Chừa chỗ cho nút dưới cùng */
        }

        /* --- HEADER --- */
        .header { 
            width: 100%; background: rgba(0,0,0,0.3); padding: 15px 0;
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .header h1 { margin: 0; text-shadow: 2px 2px 0 #000; font-size: 1.8rem; }
        .currency { 
            background: #f1c40f; color: #2c3e50; padding: 5px 15px; 
            border-radius: 20px; font-weight: 900; font-size: 1.1rem; 
            display: inline-block; margin-top: 5px; box-shadow: 0 3px 0 #d35400;
        }

        /* --- THANH TAB SỰ KIỆN (Cuộn ngang trên điện thoại) --- */
        .tabs-wrapper {
            width: 95%; max-width: 1000px; margin: 20px 0;
            overflow-x: auto; white-space: nowrap; padding-bottom: 5px;
            text-align: center;
            scrollbar-width: none; /* Ẩn thanh cuộn */
        }
        .tabs-wrapper::-webkit-scrollbar { display: none; }

        .tab-btn {
            display: inline-block; padding: 10px 20px; margin: 0 5px;
            border: none; border-radius: 25px; cursor: pointer;
            background: rgba(255,255,255,0.1); color: #bdc3c7; 
            font-family: inherit; font-weight: bold; font-size: 1rem;
            transition: 0.3s; border: 2px solid transparent;
        }
        .tab-btn.active { 
            background: #e74c3c; color: white; border-color: #fff;
            transform: scale(1.05); box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        /* --- TỦ KÍNH TRƯNG BÀY (CSS GRID) --- */
        .showcase-grid {
            width: 95%; max-width: 1000px;
            display: grid;
            /* Tự động chia cột: Điện thoại 2 cột, PC 4-5 cột */
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px;
        }

        .item-card {
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border: 2px solid #7f8c8d; border-radius: 15px;
            padding: 15px; text-align: center; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.3s;
        }
        
        /* Hiệu ứng kính bóng bẩy */
        .item-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);
            border-radius: 15px 15px 0 0; pointer-events: none;
        }

        /* Trạng thái ĐÃ SỞ HỮU */
        .item-card.owned {
            border-color: #2ecc71;
            background: linear-gradient(145deg, #27ae60, #2ecc71);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
        }

        .item-icon { font-size: 4.5rem; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); margin-bottom: 10px; transition: 0.2s; }
        .item-card:hover .item-icon { transform: scale(1.1) rotate(5deg); }
        
        .item-name { font-weight: bold; font-size: 1rem; margin-bottom: 5px; line-height: 1.2; min-height: 2.4em; display: flex; align-items: center; }

        /* Nút Mua */
        .buy-btn {
            width: 100%; padding: 10px 0; border: none; border-radius: 10px;
            background: #3498db; color: white; font-weight: 800; cursor: pointer;
            font-size: 1rem; box-shadow: 0 4px 0 #2980b9; transition: 0.2s;
        }
        .buy-btn:active { transform: translateY(4px); box-shadow: none; }

        .status-badge {
            margin-top: 5px; background: rgba(0,0,0,0.2); color: white;
            padding: 8px 0; width: 100%; border-radius: 10px; font-weight: bold;
        }

        /* --- THANH ĐIỀU HƯỚNG DƯỚI CÙNG --- */
        .bottom-nav {
            position: fixed; bottom: 20px; z-index: 200;
            background: rgba(255,255,255,0.9); padding: 8px; border-radius: 30px;
            display: flex; gap: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .nav-btn {
            padding: 10px 20px; border: none; border-radius: 20px; 
            font-weight: bold; cursor: pointer; font-size: 1rem; font-family: inherit;
            color: white; transition: 0.2s;
        }
        .nav-btn:hover { transform: translateY(-3px); }

        /* RESPONSIVE MOBILE */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.5rem; }
            .showcase-grid { grid-template-columns: 1fr 1fr; gap: 10px; } /* 2 cột trên mobile */
            .item-icon { font-size: 3.5rem; }
            .item-card { padding: 10px; }
            .buy-btn { font-size: 0.9rem; padding: 8px 0; }
        }
/* Tab chính to và nổi bật */
.main-category-tabs {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    background: rgba(0,0,0,0.2);
    padding: 10px;
    border-radius: 50px;
}
.tab-main-btn {
    padding: 12px 30px;
    border: none;
    border-radius: 40px;
    font-family: inherit;
    font-weight: 800;
    font-size: 1.2rem;
    cursor: pointer;
    background: transparent;
    color: #bdc3c7;
    transition: 0.3s;
}
.tab-main-btn.active {
    background: #f1c40f;
    color: #2c3e50;
    box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
}

/* Khung tranh cho ngăn Tranh vẽ */
.art-card {
    background: white;
    padding: 15px;
    border: 10px solid #5d4037; /* Khung gỗ */
    box-shadow: 5px 10px 20px rgba(0,0,0,0.3);
    transition: 0.3s;
    transform: rotate(calc(var(--r, 0) * 1deg));
}
.art-card:hover { transform: scale(1.05); }
.art-card img { width: 100%; border: 1px solid #eee; }
.art-info { color: #333; font-weight: bold; margin-top: 10px; font-size: 0.9rem; }
/* Tối ưu khung tranh cho Mobile */
.art-card {
    box-sizing: border-box;
    width: 100%; /* Đảm bảo khung tranh không tràn màn hình */
}

@media (max-width: 600px) {
    .art-card {
        padding: 8px;
        border-width: 6px; /* Giảm độ dày khung gỗ trên điện thoại */
    }
    .main-category-tabs {
        gap: 10px;
        padding: 5px;
    }
    .tab-main-btn {
        padding: 10px 15px;
        font-size: 1rem; /* Thu nhỏ nút tab chính cho vừa màn hình dọc */
    }
}
</style>

<body>
<div class="header">
    <h1>🏛️ PHÒNG TRƯNG BÀY SƯU TẬP</h1>
    <div class="currency">💎 Kim cương của bé: <span id="user-score">0</span></div>
</div>
<div class="main-category-tabs">
    <button class="tab-main-btn active" id="btn-tab-souvenir" onclick="switchGallery('souvenir')">
        🎁 Quà Lưu Niệm
    </button>
    <button class="tab-main-btn" id="btn-tab-drawing" onclick="switchGallery('drawing')">
        🖼️ Tranh Vẽ Của Bé
    </button>
</div>

<div class="tabs-wrapper" id="souvenir-filters">
    <button class="tab-btn active" onclick="showEvent('Tet')">🌸 Tết</button>
    <button class="tab-btn" onclick="showEvent('Noel')">🎄 Noel</button>
    <button class="tab-btn" onclick="showEvent('Halloween')">🎃 Halloween</button>
    <button class="tab-btn" onclick="showEvent('MidAutumn')">🏮 Trung Thu</button>
    <button class="tab-btn" onclick="showEvent('Valentine')">❤️ Valentine</button>
    <button class="tab-btn" onclick="showEvent('Summer')">⛱️ Mùa Hè</button>
    <button class="tab-btn" onclick="showEvent('Birthday')">🎂 Sinh Nhật</button>
</div>

<div class="showcase-grid" id="display-area">
    <div style="grid-column:1/-1; text-align:center; padding:30px;">Đang mở cửa phòng trưng bày...</div>
</div>

<div id="souvenir-inventory-section">
    <h2 style="margin-top: 50px; color: #f1c40f; text-align: center;">🏆 KỆ SƯU TẬP CỦA BÉ</h2>
    <div class="showcase-grid" id="inventory-area">
        </div>
</div>
    <div class="bottom-nav">
        <button class="nav-btn" style="background:#7f8c8d" onclick="window.location.href='index.html'">⬅️ Sảnh Chính</button>
        <button class="nav-btn" style="background:#27ae60" onclick="window.location.href='trang-tri-phong.html'">🏡 Về Nhà</button>
    </div>

    <script>
        let allItems = [];
        let userInventory = [];
        let currentScore = 0;
        let fullShopReference = []; // Lưu danh sách gốc để tra cứu icon/tên
async function init() {
    try {
        const res = await fetch('/api/house/info');
        if(res.status === 401) return window.location.href = 'login.html';
        const data = await res.json();

        currentScore = data.score || 0;
        userInventory = data.inventory || [];
        fullShopReference = data.shopItems || [];
        
        allItems = fullShopReference.filter(item => item.category === 'souvenir');

        // Cập nhật số tiền hiển thị
        const scoreEl = document.getElementById('user-score');
        if(scoreEl) scoreEl.innerText = currentScore.toLocaleString();
        
        showEvent('Tet'); 
        updateGalleryInventory();

    } catch(e) { console.error("Lỗi khởi tạo:", e); }
}
async function switchGallery(type) {
    // 1. Cập nhật trạng thái nút Tab chính
    document.querySelectorAll('.tab-main-btn').forEach(btn => btn.classList.remove('active'));
    const activeTab = document.getElementById('btn-tab-' + type);
    if (activeTab) activeTab.classList.add('active');

    // 2. Lấy các phần tử giao diện
    const displayArea = document.getElementById('display-area');
    const souvenirFilters = document.getElementById('souvenir-filters');
    const souvenirInventory = document.getElementById('souvenir-inventory-section');

    // 3. Xử lý logic hiển thị riêng biệt
    if (type === 'souvenir') {
        // --- CHẾ ĐỘ QUÀ LƯU NIỆM ---
        if (souvenirFilters) souvenirFilters.style.display = 'flex';
        if (souvenirInventory) souvenirInventory.style.display = 'block';
        
        displayArea.innerHTML = '<div style="grid-column: 1/-1; text-align:center;">Đang mở tiệm quà...</div>';
        
        // Gọi hàm hiển thị shop quà (mặc định là Tết)
        if (typeof showEvent === "function") showEvent('Tet'); 
        // Cập nhật kệ sưu tập 2D
        if (typeof updateGalleryInventory === "function") updateGalleryInventory();

    } else {
        // --- CHẾ ĐỘ TRIỂN LÃM TRANH VẼ ---
        if (souvenirFilters) souvenirFilters.style.display = 'none';
        if (souvenirInventory) souvenirInventory.style.display = 'none';
        
        displayArea.innerHTML = '<div style="grid-column: 1/-1; text-align:center;">🖼️ Đang treo tranh lên tường...</div>';

        try {
            const res = await fetch('/api/user/progress');
            if (!res.ok) throw new Error("Không thể tải dữ liệu");
            const user = await res.json();
            
            displayArea.innerHTML = ''; // Xóa thông báo chờ

            if (!user.galleryDrawings || user.galleryDrawings.length === 0) {
                displayArea.innerHTML = `
                    <div style="grid-column: 1/-1; text-align:center; padding: 50px; opacity:0.6;">
                        <div style="font-size: 5rem;">🎨</div>
                        <p style="font-size: 1.2rem;">Bé chưa có bức tranh triển lãm nào.<br>Hãy đạt 9-10 điểm tại <b>Xưởng Vẽ</b> nhé!</p>
                    </div>`;
                return;
            }

            // Vẽ các bức tranh trong khung gỗ
            user.galleryDrawings.forEach(art => {
                const card = document.createElement('div');
                card.className = 'art-card';
                // Tạo độ nghiêng ngẫu nhiên (-2 đến 2 độ) cho giống triển lãm thật
                const randomRotate = (Math.random() * 4 - 2).toFixed(1);
                card.style.setProperty('--r', randomRotate);

                card.innerHTML = `
                    <div class="art-frame">
                        <img src="${art.image}" alt="Tranh bé vẽ" loading="lazy">
                    </div>
                    <div class="art-info">
                        <span>Cấp độ: ${art.level}</span>
                        <small>📅 ${new Date(art.date).toLocaleDateString('vi-VN')}</small>
                    </div>
                `;
                displayArea.appendChild(card);
            });
        } catch (e) {
            console.error(e);
            displayArea.innerHTML = '<p style="grid-column: 1/-1;">⚠️ Lỗi khi mở cửa phòng tranh. Bé thử lại sau nhé!</p>';
        }
    }
}
// Hàm hiển thị kho đồ lưu niệm 2D riêng biệt
function updateGalleryInventory() {
    const invGrid = document.getElementById('inventory-area');
    invGrid.innerHTML = '';

    // Lọc: Chỉ lấy những món trong kho của bé mà có category là 'souvenir'
    const mySouvenirs = fullShopReference.filter(item => 
        item.category === 'souvenir' && userInventory.includes(item.id)
    );

    if(mySouvenirs.length === 0) {
        invGrid.innerHTML = '<div style="grid-column:1/-1; opacity:0.5;">Bé chưa có món quà lưu niệm nào trên kệ.</div>';
        return;
    }

    mySouvenirs.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item-card owned'; // Dùng lại style đẹp của bạn
        el.innerHTML = `
            <div class="item-icon">${item.icon}</div>
            <div class="item-name">${item.name}</div>
            <div style="font-size:0.8rem; color:#fff; background:rgba(0,0,0,0.2); padding:2px 10px; border-radius:10px;">✨ Đã sưu tầm</div>
        `;
        invGrid.appendChild(el);
    });
}

// Nhớ gọi updateGalleryInventory() bên trong hàm buyItem() sau khi mua thành công nhé!
        // Tìm hàm init() trong file phong-trung-bay.html và thay bằng đoạn lọc:
        function showEvent(eventCode) {
            // Active nút Tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(getEventName(eventCode))) btn.classList.add('active');
            });

            const grid = document.getElementById('display-area');
            grid.innerHTML = '';

            // Lọc vật phẩm theo sự kiện
            const itemsToShow = allItems.filter(i => i.event === eventCode);

            if(itemsToShow.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; color:#bdc3c7">Sắp ra mắt bộ sưu tập này...</div>';
                return;
            }

            itemsToShow.forEach(item => {
                const isOwned = userInventory.includes(item.id);
                const el = document.createElement('div');
                
                // Thêm class 'owned' nếu đã mua để đổi màu nền
                el.className = `item-card ${isOwned ? 'owned' : ''}`;
                
                el.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    ${isOwned 
                        ? `<div class="status-badge">✅ Đã sở hữu</div>` 
                        : `<button class="buy-btn" onclick="buyItem('${item.id}', ${item.price}, '${item.name}', this)">MUA ${item.price}💎</button>`
                    }
                `;
                grid.appendChild(el);
            });
        }

 function getEventName(code) {
    if(code === 'Tet') return 'Tết';
    if(code === 'Noel') return 'Giáng Sinh';
    if(code === 'Halloween') return 'Halloween';
    if(code === 'MidAutumn') return 'Trung Thu';
    // --- BỔ SUNG THÊM CÁC DÒNG NÀY ---
    if(code === 'Valentine') return 'Valentine';
    if(code === 'Summer') return 'Mùa Hè';
    if(code === 'Birthday') return 'Sinh Nhật';
    return 'Khác';
}
        async function buyItem(id, price, name, btn) {
            if(currentScore < price) {
                alert("💎 Bé không đủ kim cương rồi! Hãy chơi game để kiếm thêm nhé.");
                return;
            }

            if(!confirm(`Bé muốn mua "${name}" với giá ${price} kim cương?`)) return;

            // Hiệu ứng chờ
            const originalText = btn.innerText;
            btn.innerText = "⏳...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/house/buy', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ itemId: id })
                });
                const d = await res.json();

                if(res.ok) {
                    // 1. Cập nhật tiền & Kho
                    currentScore = d.newScore;
                    document.getElementById('user-score').innerText = currentScore.toLocaleString();
                    userInventory.push(id);

                    // 2. Hiệu ứng pháo hoa
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    updateGalleryInventory();
                    // 3. Biến đổi giao diện nút Mua -> Đã có (ngay lập tức)
                    const card = btn.parentElement;
                    card.classList.add('owned'); // Đổi màu thẻ
                    
                    const badge = document.createElement('div');
                    badge.className = 'status-badge';
                    badge.innerText = '✅ Đã sở hữu';
                    btn.replaceWith(badge); // Thay thế nút

                } else {
                    alert(d.message);
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch(e) {
                alert("Lỗi kết nối!");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        init();
    </script>
