<head>

    <meta charset="UTF-8">
    <title>Vua Cờ - Chạm & Chơi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background: radial-gradient(circle at center, #1e3799, #0c2461);
            color: white; margin: 0; font-family: 'Baloo 2', cursive;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overscroll-behavior: none; 
        }

        /* HEADER */
        .header-bar {
            width: 100%; padding: 10px 0; background: rgba(0,0,0,0.3);
            text-align: center; display: flex; justify-content: space-between; align-items: center;
        }
        .header-title { font-size: 1.5rem; margin: 0; text-shadow: 2px 2px 0 #000; flex-grow: 1; }
        .back-btn { 
            background: #e74c3c; color: white; border: none; padding: 5px 15px; 
            border-radius: 20px; font-weight: bold; cursor: pointer; margin-left: 10px; font-size: 0.9rem;
        }

        /* LAYOUT */
        .game-layout { 
            display: flex; flex-direction: column; 
            gap: 15px; justify-content: center; align-items: center;
            margin-top: 10px; width: 100%; box-sizing: border-box; 
        }

        /* BÀN CỜ */
        #myBoard {
            width: 95vw; max-width: 500px;
            border: 5px solid #f1c40f; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            -webkit-tap-highlight-color: transparent; 
        }

        /* HIỆU ỨNG CHẠM (ĐÃ SỬA THÀNH DẤU CHẤM) */
        .highlight-selected {
            box-shadow: inset 0 0 0 3px #f1c40f; /* Viền vàng ô đang chọn */
            background-color: rgba(241, 196, 15, 0.4);
        }
        .highlight-dest {
            /* Dấu chấm tròn xanh giữa ô */
            background: radial-gradient(rgba(46, 204, 113, 0.8) 19%, transparent 20%);
            cursor: pointer;
        }
        .highlight-capture {
            /* Viền tròn đỏ khi ăn quân */
            box-shadow: inset 0 0 0 4px rgba(231, 76, 60, 0.7);
            border-radius: 50%;
        }

        /* SIDEBAR */
        .sidebar {
            width: 95vw; max-width: 500px;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2);
            text-align: center; display: flex; flex-direction: column; gap: 10px;
            min-height: 250px; 
        }

        /* TABS */
        .mode-tabs { display: flex; gap: 5px; margin-bottom: 5px; }
        .tab-btn {
            flex: 1; padding: 10px 5px; border: none; border-radius: 10px;
            font-weight: bold; cursor: pointer; opacity: 0.7; transition: 0.3s; 
            font-family: inherit; font-size: 0.9rem;
        }
        .tab-btn.active { opacity: 1; transform: scale(1.02); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .tab-pve { background: #f1c40f; color: #333; }
        .tab-pvp { background: #3498db; color: white; }
        .tab-local { background: #9b59b6; color: white; }

        .mode-content { display: none; height: 100%; overflow-y: auto; }
        .mode-content.active { display: block; }

        /* GRID LEVEL */
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding-right: 5px; max-height: 200px; overflow-y: auto; }
        .lvl-btn { 
            padding: 10px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;
            background: #34495e; color: #bdc3c7; transition: 0.2s; font-size: 1rem;
        }
        .lvl-btn.passed { background: #2ecc71; color: white; }
        .lvl-btn.current { background: #f1c40f; color: black; box-shadow: 0 0 10px #f1c40f; }
        .lvl-btn.locked { opacity: 0.5; cursor: not-allowed; }

        .status-text { font-size: 1.1rem; font-weight: bold; color: #fff; min-height: 25px; margin: 5px 0; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 5px; }
        .action-btn {
            width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 50px;
            font-weight: bold; font-size: 1.1rem; cursor: pointer; color: white;
            transition: 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.2); font-family: inherit;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: none; }
        .btn-green { background: #2ecc71; } .btn-blue { background: #3498db; } .btn-orange { background: #e67e22; }
        .room-input { width: 60%; padding: 10px; border-radius: 10px; border: none; text-align: center; font-weight: bold; font-size: 1rem; }
    </style>

<link rel="stylesheet" href="board-ui-v8.css">

<body>

    <div class="header-bar">
        <button class="back-btn" onclick="window.location.href='index.html'">⬅️ Về</button>
        <h1 class="header-title">♟️ VUA CỜ ♟️</h1>
        <div style="width: 50px;"></div>
    </div>
    
    <div id="tourney-timer" style="background:#e74c3c; color:white; padding:10px; border-radius:10px; margin-bottom:10px; display:none;">
        ⚠️ GIẢI ĐẤU: Bé còn <span id="time-left" style="font-size:1.5rem; font-weight:bold;">10:00</span>
    </div>

    <div class="game-layout">
        <div id="myBoard"></div>

        <div class="sidebar">
            <div class="mode-tabs">
                <button class="tab-btn tab-pve active" onclick="switchMode('pve')">🏰 Leo Tháp</button>
                <button class="tab-btn tab-pvp" onclick="switchMode('pvp')">⚔️ Online</button>
                <button class="tab-btn tab-local" onclick="switchMode('local')">👥 2 Người</button>
            </div>

            <div id="pve-panel" class="mode-content active">
                <div class="status-text" id="pve-status">Chọn cấp độ để chơi!</div>
                <button class="action-btn btn-blue" onclick="undoMove()" style="padding: 8px; margin-bottom: 10px;">↩️ Đi Lại</button>
                <div class="level-grid" id="level-list"></div>
            </div>

            <div id="pvp-panel" class="mode-content">
                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; margin-bottom: 10px;">
                    <div id="pvp-room-info" style="font-size: 1.1rem; color: #f1c40f;">Chưa vào phòng</div>
                    <div class="status-text" id="pvp-status">Hãy tìm đối thủ...</div>
                </div>
                <button class="action-btn btn-orange" onclick="findRandomMatch()">🎲 Ghép Ngẫu Nhiên</button>
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <button class="action-btn btn-green" style="flex:1; font-size: 0.9rem;" onclick="createGroup()">Tạo</button>
                    <input type="text" id="room-code-input" class="room-input" placeholder="Mã..." style="width: 30%;">
                    <button class="action-btn btn-blue" style="width: auto; padding: 0 15px;" onclick="joinGroup()">Vào</button>
                </div>
            </div>

            <div id="local-panel" class="mode-content">
                <div class="status-text" id="local-status">Chơi cùng bạn bè!</div>
                <p style="margin: 10px 0; color: #ecf0f1;">Hai bạn thay phiên nhau đi trên cùng một máy.</p>
                <button class="action-btn btn-green" onclick="startLocalGame()">▶️ Bắt Đầu Ván Mới</button>
                <button class="action-btn btn-blue" onclick="undoMove()">↩️ Đi Lại</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
    let board = null, game = new Chess(), socket = io();
    let stockfish = null;
    let currentMode = 'pve'; 
    let userLevel = 1;
    let currentPlayingLevel = 1; 
    let isGameActive = false;
    let myRole = 'w'; 
    let currentRoom = null;
    let opponentUsername = '';
    let resultReported = false;
    let gameStartTime;
    let matchTimer = null;
    let secondsLeft = 600;
    let selectedSquare = null;

    // --- KHỞI TẠO STOCKFISH ---
    try { 
        stockfish = new Worker('stockfish.js'); 
        stockfish.postMessage('uci');
        stockfish.onmessage = (e) => {
            if (e.data.includes('bestmove')) {
                clearTimeout(window.aiSafetyTimeout);
                const m = e.data.split(' ')[1];
                // Chỉ cho máy đi nếu đang là PvE và đến lượt máy
                if (isGameActive && game.turn() === 'b' && m && currentMode === 'pve') {
                    game.move({ from: m.substring(0,2), to: m.substring(2,4), promotion: 'q' });
                    board.position(game.fen());
                    updateStatus();
                }
            }
        };
    } catch(e) {}

    function getPieceImg(piece) {
        const map = {'wP':'plt45','wN':'nlt45','wB':'blt45','wR':'rlt45','wQ':'qlt45','wK':'klt45','bP':'pdt45','bN':'ndt45','bB':'bdt45','bR':'rdt45','bQ':'qdt45','bK':'kdt45'};
        const code = map[piece];
        const hash = {'wP':'4/45','wN':'7/70','wB':'b/b1','wR':'7/72','wQ':'1/15','wK':'4/42','bP':'c/c7','bN':'e/ef','bB':'9/98','bR':'f/ff','bQ':'4/47','bK':'f/f0'}[piece];
        return `https://upload.wikimedia.org/wikipedia/commons/${hash}/Chess_${code}.svg`;
    }

    async function init() {
        try {
            const res = await fetch('/api/user/progress');
            const data = await res.json();
            userLevel = data.chessLevel || 1;
        } catch(e) {}
        renderLevelList();
        
        const config = { draggable: false, position: 'start', pieceTheme: getPieceImg };
        board = Chessboard('myBoard', config);
        $(window).resize(board.resize);
        $('#myBoard').on('click', '.square-55d63', onSquareClick);
        const tournamentRoom = new URLSearchParams(location.search).get('room');
        if (tournamentRoom) {
            currentMode = 'pvp';
            switchMode('pvp');
            currentRoom = tournamentRoom.toUpperCase();
            document.getElementById('room-code-input').value = currentRoom;
            document.getElementById('pvp-status').textContent = 'Đang vào phòng giải đấu...';
            socket.emit('joinChessRoom', currentRoom);
        }
    }

    // --- XỬ LÝ CLICK (QUAN TRỌNG: ĐÃ THÊM LOGIC 2 NGƯỜI) ---
    async function onSquareClick() {
        if (!isGameActive) return;
        
        // 1. CHẶN LƯỢT (Chỉ áp dụng cho PVE và PVP, LOCAL thì ai cũng đi được)
        if (currentMode === 'pve' && game.turn() === 'b') return; 
        if (currentMode === 'pvp' && game.turn() !== myRole) return;

        const square = $(this).data('square');
        const piece = game.get(square);

        // 2. DI CHUYỂN QUÂN
        if (selectedSquare) {
            // Nếu bấm lại vào chính quân đang chọn -> Bỏ chọn
            if (selectedSquare === square) {
                removeHighlights(); selectedSquare = null; return;
            }
            
            // Thử đi
            const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
            
            if (move) {
                board.position(game.fen());
                removeHighlights();
                selectedSquare = null;
                updateStatus();

                // Logic sau khi đi
                if (currentMode === 'pve' && isGameActive) {
                    document.getElementById('pve-status').textContent = "🤖 Máy đang nghĩ...";
                    setTimeout(makeAiMove, 500);
                } else if (currentMode === 'pvp') {
                    socket.emit('move', { room: currentRoom, move: move });
                    document.getElementById('pvp-status').textContent = "Đợi đối thủ...";
                } else if (currentMode === 'local' && isGameActive) {
                    // Chế độ 2 người: Cập nhật text
                    const nextP = game.turn() === 'w' ? "Trắng (White)" : "Đen (Black)";
                    document.getElementById('local-status').textContent = `Đến lượt: ${nextP}`;
                    // Xoay bàn cờ nếu thích (bỏ comment dòng dưới)
                    // board.flip(); 
                }
                return;
            }
        }

        // 3. CHỌN QUÂN (HIGHLIGHT)
        if (piece) {
            let isMyPiece = false;
            // Kiểm tra quyền sở hữu
            if (currentMode === 'pve') isMyPiece = (piece.color === 'w');
            else if (currentMode === 'pvp') isMyPiece = (piece.color === myRole);
            else if (currentMode === 'local') isMyPiece = (piece.color === game.turn()); // LOCAL: Lượt ai người đó được bấm

            if (isMyPiece) {
                removeHighlights();
                selectedSquare = square;
                highlightSquare(square);
                highlightMoves(square);
            }
        }
    }

    // --- HIỆU ỨNG ---
    function highlightSquare(square) {
        $('#myBoard .square-' + square).addClass('highlight-selected');
    }
    function highlightMoves(square) {
        const moves = game.moves({ square: square, verbose: true });
        for (const move of moves) {
            const $sq = $('#myBoard .square-' + move.to);
            // Nếu ăn quân -> Viền đỏ, Nếu đi thường -> Dấu chấm
            if (game.get(move.to)) $sq.addClass('highlight-capture');
            else $sq.addClass('highlight-dest');
        }
    }
    function removeHighlights() {
        $('#myBoard .square-55d63').removeClass('highlight-selected highlight-dest highlight-capture');
    }

    // --- LOGIC CHUNG ---
    window.switchMode = function(mode) {
        currentMode = mode;
        isGameActive = false;
        game.reset(); board.start();
        removeHighlights(); selectedSquare = null;
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`.tab-${mode}`).classList.add('active');
        document.getElementById(`${mode}-panel`).classList.add('active');

        if(mode === 'pve') document.getElementById('pve-status').textContent = "Chọn cấp độ...";
        if(mode === 'local') document.getElementById('local-status').textContent = "Nhấn Bắt Đầu để chơi";
    };

    window.startAiGame = function(level) {
        currentPlayingLevel = level;
        game.reset(); board.start(); board.orientation('white');
        isGameActive = true; myRole = 'w';
        document.getElementById('pve-status').textContent = `🎮 Cấp ${level}`;
    };

    window.startLocalGame = function() {
        game.reset(); board.start(); board.orientation('white');
        isGameActive = true;
        document.getElementById('local-status').textContent = "Đến lượt: Trắng (White)";
    };

    window.undoMove = function() {
        if (!isGameActive) return;
        // PVE: Đi lại 2 nước (để về lượt mình)
        if (currentMode === 'pve' && game.history().length >= 2) {
            game.undo(); game.undo();
            board.position(game.fen());
        }
        // LOCAL: Đi lại 1 nước (để người vừa đi đi lại)
        else if (currentMode === 'local' && game.history().length >= 1) {
            game.undo();
            board.position(game.fen());
            const nextP = game.turn() === 'w' ? "Trắng" : "Đen";
            document.getElementById('local-status').textContent = `Đến lượt: ${nextP}`;
            // Nếu có xoay bàn cờ thì xoay lại
            // board.flip();
        }
        removeHighlights(); selectedSquare = null;
    };

    function makeAiMove() {
        if (!isGameActive) return;
        // Logic AI đơn giản (nếu không có Stockfish)
        if (!stockfish) {
            const moves = game.moves();
            if (moves.length > 0) {
                game.move(moves[Math.floor(Math.random() * moves.length)]);
                board.position(game.fen());
                updateStatus();
            }
            return;
        }
        // Logic AI Stockfish
        let skill = Math.floor((currentPlayingLevel / 100) * 20);
        stockfish.postMessage(`setoption name Skill Level value ${skill}`);
        stockfish.postMessage(`position fen ${game.fen()}`);
        stockfish.postMessage(`go depth 5 movetime 500`);
    }

    
    // --- KIỂM TRA THẮNG THUA (BẢN TỐI ƯU) ---
    async function updateStatus() {
        const isMate = game.in_checkmate();
        const isDraw = game.in_draw() || game.in_stalemate() || game.in_threefold_repetition();
        
        let statusEl = document.getElementById(currentMode + '-status');

        if (isMate) {
            isGameActive = false;
            let winnerColor = game.turn() === 'w' ? 'Đen' : 'Trắng';
            
            if (currentMode === 'pve') {
                if (winnerColor === 'Trắng') {
                    statusEl.textContent = "🏆 BẠN THẮNG!";
                    handlePveWin(); // Hàm này sẽ hiện Modal và pháo hoa
                } else {
                    statusEl.textContent = "😢 MÁY THẮNG!";
                    showResultModal(false, 0, "Máy thắng rồi, bé cố gắng ở ván sau nhé!");
                }
            } else if (currentMode === 'local') {
                statusEl.textContent = `🏆 ${winnerColor} THẮNG!`;
                confetti();
                showResultModal(true, 0, `Chúc mừng quân ${winnerColor} đã chiến thắng!`);
            } else {
                // Online (PVP)
                statusEl.textContent = "🏁 TRẬN ĐẤU KẾT THÚC";
                const winnerRole = game.turn() === 'w' ? 'b' : 'w';
                const iWon = myRole === winnerRole;
                const localUsername = localStorage.getItem('currentUser') || '';
                const winnerUsername = iWon ? localUsername : opponentUsername;
                if (currentRoom?.startsWith('TOUR-') && winnerUsername && !resultReported) {
                    resultReported = true;
                    socket.emit('reportGameResult', { roomId: currentRoom, winner: winnerUsername });
                }
                showResultModal(iWon, 0, iWon ? "Bé thắng đối thủ rồi! Đang xác nhận kết quả giải đấu." : "Đối thủ đã thắng. Hệ thống đang xác nhận kết quả.");
            }
        } else if (isDraw) {
            isGameActive = false;
            statusEl.textContent = "🤝 HÒA CỜ!";
            showResultModal(false, 0, "Ván cờ Hòa! Hai bé đều rất giỏi.");
        } else {
            // Cập nhật text lượt đi khi đang đấu
            if (currentMode === 'local') {
                const nextP = game.turn() === 'w' ? "Trắng" : "Đen";
                statusEl.textContent = `Đến lượt: ${nextP}`;
            }
        }
    }

    async function handlePveWin() {
        confetti();
        try {
            const res = await fetch('/api/game/chess-win-level', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ level: currentPlayingLevel })
            });
            const d = await res.json();
            if(d.newLevel) { 
                userLevel = d.newLevel; 
                renderLevelList(); 
            }
            showResultModal(true, d.addedPoints, d.message);
        } catch(e) {
            showResultModal(true, 0, "Bé thắng máy rồi! Quá siêu!");
        }
    }
    function renderLevelList() {
        const list = document.getElementById('level-list');
        list.innerHTML = '';
        for(let i=1; i<=100; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            if (i < userLevel) btn.className = 'lvl-btn passed';
            else if (i === userLevel) btn.className = 'lvl-btn current';
            else btn.className = 'lvl-btn locked';
            btn.onclick = () => { if (i <= userLevel) startAiGame(i); };
            list.appendChild(btn);
        }
    }

    // --- SOCKET P2P ---
    window.createGroup = () => { socket.emit('createChessRoom'); document.getElementById('pvp-status').textContent = "Đang tạo..."; };
    window.joinGroup = () => { const code=document.getElementById('room-code-input').value.trim().toUpperCase(); if(!code){document.getElementById('pvp-status').textContent='Hãy nhập mã phòng.';return;} socket.emit('joinChessRoom', code); };
    window.findRandomMatch = () => { socket.emit('findMatch', 'chess'); document.getElementById('pvp-status').textContent = "Đang tìm..."; };

    socket.on('roomCreated', (id) => { 
        currentRoom = id; 
        document.getElementById('pvp-room-info').innerHTML = `Mã: <b>${id}</b>`; 
    });
    socket.on('matchFound', (data) => {
        currentMode = 'pvp'; switchMode('pvp'); 
        isGameActive = true; currentRoom = data.room; myRole = data.role; opponentUsername = data.opponent || ''; resultReported = false;
        game.reset(); board.start(); 
        board.orientation(myRole === 'w' ? 'white' : 'black');
        document.getElementById('pvp-status').textContent = myRole === 'w' ? "Bạn đi trước" : "Bạn đi sau";
        
        // Kích hoạt đồng hồ khi đấu online
        if(data.matchDuration) startTournamentTimer(data.matchDuration);
    });
    socket.on('move', (m) => { game.move(m); board.position(game.fen()); updateStatus(); });
    socket.on('resultPending', data => boardNotice(`Đã nhận ${data.confirmations}/${data.required} xác nhận kết quả.`,2600));
    socket.on('gameOver', data => { if (data?.reason === 'consensus') boardNotice(`Kết quả đã được xác nhận: ${data.winner} thắng.`,3600); });
    socket.on('opponentLeft', () => { boardNotice('Đối thủ đã rời phòng. Ván đấu sẽ được làm mới.',2600); setTimeout(()=>location.reload(),2700); });

    // --- BỘ ĐẾM GIỜ ---
    function startTournamentTimer(mins) {
        clearInterval(matchTimer);
        secondsLeft = mins * 60;
        if(document.getElementById('tourney-timer')) {
            document.getElementById('tourney-timer').style.display = 'block';
        }
        matchTimer = setInterval(() => {
            const isMyTurn = (currentMode === 'pvp' && game.turn() === myRole);
            if (isMyTurn && isGameActive) {
                secondsLeft--;
                const m = Math.floor(secondsLeft / 60);
                const s = secondsLeft % 60;
                const display = document.getElementById('time-left');
                if(display) display.textContent = `${m}:${s < 10 ? '0'+s : s}`;
                if (secondsLeft <= 0) {
                    clearInterval(matchTimer);
                    socket.emit('timeoutLoss', { room: currentRoom, loserUsername: localStorage.getItem('currentUser'), gameType: 'Cờ Vua' });
                }
            }
        }, 1000);
    }
    
    // --- MODAL KẾT QUẢ ---
    function showResultModal(isWin, points, msg) {
       const modal = document.getElementById('result-modal');
       document.getElementById('modal-title').textContent = isWin ? "CHIẾN THẮNG" : "THUA CUỘC";
       document.getElementById('modal-msg').textContent = msg;
       modal.style.display = 'flex';
    }
    function closeResultModal() { document.getElementById('result-modal').style.display = 'none'; }
    function goToNextLevel() { closeResultModal(); startAiGame(userLevel); }
    function replayLevel() { closeResultModal(); startAiGame(currentPlayingLevel); }

    init();
    </script>
    
    <div id="result-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px;">
        <div style="background: white; padding: 30px; border-radius: 30px; text-align: center; width: 100%; max-width: 320px; color: #333;">
            <h2 id="modal-title" style="margin: 0; color: #e74c3c; font-size: 2rem;">🏆 THẮNG RỒI!</h2>
            <div id="modal-stars" style="font-size: 2rem; margin: 10px 0;">⭐⭐⭐⭐⭐</div>
            <p id="modal-msg" style="font-weight: bold; color: #555;">Bé đã vượt qua Cấp độ 1!</p>
            <button class="btn-game btn-new" id="btn-next-lvl" onclick="goToNextLevel()">MÀN TIẾP THEO ➡️</button>
            <button class="btn-game" style="background:#3498db" onclick="replayLevel()">CHƠI LẠI 🔄</button>
            <button class="btn-game" style="background:#95a5a6" onclick="closeResultModal()">QUAY LẠI MENU</button>
        </div>
