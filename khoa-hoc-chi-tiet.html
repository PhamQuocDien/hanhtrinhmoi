(function(){
  const root=document.getElementById('detail');
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  let data;
  const mediaPollAttempts=new Map();
  function assessment(a){
    if(!a)return '';
    const id=a._id||a.id||a.code;
    const qs=a.questionIds||a.questionPool||a.questions||[];
    return `<div class="assessment"><strong>${esc(a.title||a.code)}</strong><p class="muted">${esc(a.assessmentType||'TEST')} · ${esc(qs.length||a.questionCount||0)} câu · ${esc(a.durationSeconds?Math.round(a.durationSeconds/60):'—')} phút · đạt ${esc(a.passingScore??70)}%</p>${id?`<a class="button button-secondary" href="assessment.html?id=${encodeURIComponent(id)}">Làm bài</a>`:''}</div>`;
  }
  function renderPracticeTask(item,index){
    const structured=item&&typeof item==='object'&&!Array.isArray(item)?item:{};
    const raw=typeof item==='string'?item:'';
    const title=structured.title||structured.name||structured.label||`Nhiệm vụ luyện tập ${index+1}`;
    const instruction=structured.instructions||structured.task||structured.prompt||structured.statement||structured.description||structured.content||raw||'Hoàn thành nhiệm vụ và đối chiếu kết quả với ví dụ.';
    const inputFormat=structured.inputFormat||structured.input||'';
    const outputFormat=structured.outputFormat||structured.expectedOutput||structured.deliverable||'';
    const samples=Array.isArray(structured.visibleTestCases)?structured.visibleTestCases:Array.isArray(structured.samples)?structured.samples:[];
    const criteria=Array.isArray(structured.scoringCriteria)?structured.scoringCriteria:Array.isArray(structured.rubric)?structured.rubric:[];
    const mode=/debug|sửa lỗi/i.test(title+' '+instruction)?'Sửa lỗi và chạy lại test':/timed|giới hạn thời gian/i.test(title+' '+instruction)?'Bài luyện có thời gian':/independent|mini deliverable/i.test(title+' '+instruction)?'Nộp sản phẩm độc lập':'Luyện tập có hướng dẫn';
    const deliverable=outputFormat||structured.expectedResult||(mode==='Sửa lỗi và chạy lại test'?'Mã nguồn đã sửa và ít nhất 1 test chứng minh lỗi đã được xử lý.':mode==='Nộp sản phẩm độc lập'?'Sản phẩm/lời giải, cách kiểm thử và giải thích độ phức tạp nếu là thuật toán.':'Lời giải từng bước và kết quả đối chiếu với ít nhất một ví dụ.');
    return `<article class="practice-task-card"><div class="practice-task-card-head"><span class="practice-task-step">${index+1}</span><div><small>${esc(mode)}</small><h4>${esc(title)}</h4></div></div><p>${esc(instruction)}</p>${inputFormat?`<div class="practice-spec"><strong>Đầu vào</strong><p>${esc(inputFormat)}</p></div>`:''}${outputFormat?`<div class="practice-spec"><strong>Đầu ra mong đợi</strong><pre>${esc(outputFormat)}</pre></div>`:''}<div class="practice-spec"><strong>Sản phẩm cần hoàn thành</strong><p>${esc(deliverable)}</p></div>${samples.length?`<details><summary>${samples.length} test/ví dụ công khai</summary>${samples.map((sample,sampleIndex)=>`<div class="practice-sample"><strong>Test ${sampleIndex+1}</strong><div><span>Input</span><pre>${esc(sample.input||'')}</pre></div><div><span>Output</span><pre>${esc(sample.expectedOutput||sample.output||'')}</pre></div></div>`).join('')}</details>`:''}${criteria.length?`<div class="practice-spec"><strong>Tiêu chí tự đối chiếu</strong><ul>${criteria.map(criterion=>`<li>${esc(typeof criterion==='string'?criterion:criterion.name||criterion.description||criterion.title||'Tiêu chí')}</li>`).join('')}</ul></div>`:`<div class="practice-score-note"><strong>Cách tự kiểm tra</strong><ol><li>Hoàn thành đúng yêu cầu của nhiệm vụ.</li><li>Chạy ví dụ mẫu và ít nhất một trường hợp biên.</li><li>Ghi lại kết quả thực tế và giải thích vì sao đúng.</li></ol><small>Đây là checklist tự đánh giá, không phải điểm tự động. Bài chấm tự động sẽ ghi rõ số test và điểm.</small></div>`}<form class="assignment-submit-form" data-assignment-submission data-task-title="${esc(title)}" data-task-index="${index}"><label>Bài làm / lời giải (có thể để trống nếu nộp tệp hoặc liên kết)<textarea name="submissionText" maxlength="20000" rows="5" placeholder="Trình bày các bước, kết quả kiểm tra và giải thích của bạn…"></textarea></label><label>Tệp sản phẩm (tối đa 3 MB)<input name="submissionFile" type="file" accept=".pdf,.docx,.xlsx,.pptx,.txt,.csv,.png,.jpg,.jpeg,.zip,.cpp,.h,.hpp,.c,.py,.java,.js,.ts,.html,.css,.sql,.md"></label><label>Liên kết sản phẩm (không bắt buộc)<input name="submissionUrl" type="url" maxlength="2048" placeholder="https://…"></label><button class="button button-primary" type="submit">Nộp bài để chấm điểm</button><p class="muted" data-assignment-status role="status" aria-live="polite">Bài nộp sẽ được lưu vào tài khoản và chờ giáo viên/Admin chấm.</p></form></article>`;
  }
  function renderPracticalCriteria(practical){
    const rubric=Array.isArray(practical.rubric)?practical.rubric:Array.isArray(practical.scoringCriteria)?practical.scoringCriteria:[];
    return rubric.length?`<div class="practice-score-note"><strong>Tiêu chí chấm sản phẩm</strong><ul>${rubric.map(item=>`<li>${esc(typeof item==='string'?item:item.name||item.description||item.title||'Tiêu chí')}</li>`).join('')}</ul><small>${practical.autoGraded?'Có quy tắc tự động được cấu hình.':'Cần người chấm đối chiếu rubric; không tự gán điểm khi chưa có bộ chấm.'}</small></div>`:'<div class="practice-score-note"><strong>Cách đánh giá</strong><p>Hoàn thành sản phẩm, ghi lại bằng chứng kiểm tra và đối chiếu checklist. Bài này chưa có rubric có trọng số nên không được tự hiển thị điểm số giả.</p></div>';
  }
  function readableText(value){const text=String(value??'').trim();if(!text)return '<p class="muted">Nội dung sẽ được bổ sung trong bản cập nhật bài học.</p>';const sentences=text.split(/(?<=[.!?。！？])\s+/).filter(Boolean);const paragraphs=[];for(let i=0;i<sentences.length;i+=2)paragraphs.push(sentences.slice(i,i+2).join(' '));return paragraphs.map(part=>`<p>${esc(part)}</p>`).join('')}
  function markdownSafe(value){
    const lines=String(value??'').replace(/\r/g,'').split('\n');
    let html='',listOpen=false,codeOpen=false,codeLines=[];
    const closeList=()=>{if(listOpen){html+='</ul>';listOpen=false}};
    for(const line of lines){
      if(line.trim().startsWith('```')){closeList();if(codeOpen){html+='<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>';codeLines=[];codeOpen=false}else codeOpen=true;continue}
      if(codeOpen){codeLines.push(line);continue}
      const heading=line.match(/^(#{1,4})\s+(.+)$/),bullet=line.match(/^\s*[-*+]\s+(.+)$/);
      if(heading){closeList();const level=heading[1].length+2;html+='<h'+level+'>'+esc(heading[2])+'</h'+level+'>'}
      else if(bullet){if(!listOpen){html+='<ul>';listOpen=true}html+='<li>'+esc(bullet[1])+'</li>'}
      else{closeList();if(line.trim()){const safe=esc(line).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(new RegExp('\\x60([^\\x60]+)\\x60','g'),'<code>$1</code>');html+='<p>'+safe+'</p>'}}
    }
    closeList();if(codeOpen)html+='<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>';
    return html||'<p class="muted">Chưa có nội dung đã công bố.</p>';
  }
  async function loadTypedContentBlocks(lesson){
    const target=document.getElementById(`typed-content-${lesson._id||lesson.id}`);
    if(!target||!/^[a-f0-9]{24}$/i.test(String(lesson._id||'')))return;
    try{const blocks=await HanhTrinhApi.get(`/api/learning-system/content-blocks/lesson/${encodeURIComponent(lesson._id)}`);if(!Array.isArray(blocks)||!blocks.length){target.hidden=true;return}target.hidden=false;target.innerHTML='<article class="ai-v18-card"><h3>📘 Nội dung học đã biên tập</h3><p class="muted">Các phần dưới đây được quản lý riêng qua biểu mẫu Admin.</p>'+blocks.map((block,index)=>'<details class="theory-block" '+(index===0?'open':'')+'><summary><span>'+esc(block.title)+'</span><small>'+esc(block.type)+' · '+Number(block.estimatedMinutes||5)+' phút</small></summary><div class="theory-content">'+markdownSafe(block.body)+'</div></details>').join('')+'</article>'}catch(_){target.hidden=true}
  }
  async function openLesson(id){
    const outlines=[...(data.lessons||[]),...(data.chapters||[]).flatMap(chapter=>chapter.lessons||[]),...(data.units||[]).flatMap(unit=>unit.lessons||[])];
    let lesson=outlines.find(item=>String(item._id||item.id)===String(id));
    if(!lesson)return;
    let panel=document.getElementById('lesson-view');
    if(!panel){panel=document.createElement('section');panel.id='lesson-view';panel.className='module';root.appendChild(panel)}
    if(lesson.locked){panel.innerHTML=`<article class="ai-v18-card"><h2>🔒 Bài học đang khóa</h2><p>${esc(lesson.lockReason||'Hãy hoàn thành bài trước và đạt bài kiểm tra để mở khóa.')}</p></article>`;panel.scrollIntoView({behavior:'smooth',block:'start'});return}
    panel.innerHTML='<p class="muted">Đang tải nội dung chi tiết của bài học…</p>';
    try{const response=await HanhTrinhApi.lesson(id);lesson=response.lesson||response.data?.lesson||response;if(!lesson||lesson.locked)throw Object.assign(new Error('Bài học đang khóa. Hãy hoàn thành bài trước và đạt bài kiểm tra để mở khóa.'),{status:423,code:'LESSON_LOCKED'});}
    catch(error){panel.innerHTML=`<article class="ai-v18-card"><h2>${error.status===423?'🔒 Bài học đang khóa':'Không thể tải bài học'}</h2><p>${esc(error.message||'Vui lòng thử lại.')}</p></article>`;return}
    const theory=(lesson.theorySections||[]).map((x,index)=>{const count=String(x.content||'').trim().split(/\s+/).filter(Boolean).length;return `<details class="theory-block" ${index===0?'open':''}><summary><span>${esc(x.title||`Phần ${index+1}`)}</span><small>~${Math.max(1,Math.ceil(count/90))} phút</small></summary><div class="theory-content">${readableText(x.content)}</div></details>`}).join('');
    const examples=(lesson.examples||[]).map(x=>`<li><strong>${esc(x.title||'Ví dụ')}</strong>: ${esc(x.text||x.problem||x.content||x)}</li>`).join('');
    const practiceItems=lesson.payload?.practiceTasks||lesson.practiceTasks||[];const practice=Array.isArray(practiceItems)?practiceItems.map(renderPracticeTask).join(''):'';const codingContext={...(data.course||{}),title:[data.course?.name||data.course?.title||'',lesson.title,lesson.subjectId||'',...(lesson.skills||[])].join(' ')};const isProgrammingLesson=Boolean(window.HtmAlgorithmPractice?.isProgrammingCourse(codingContext));const practiceRootId=`algorithm-practice-${lesson._id||lesson.id}`;
    const mistakes=(lesson.payload?.commonMistakes||lesson.commonMistakes||[]).map(x=>`<li>${esc(x)}</li>`).join('');
    const checks=(lesson.payload?.quickChecks||lesson.quickChecks||[]).map(x=>`<li>${esc(x)}</li>`).join('');
    const summary=lesson.payload?.summary||lesson.summary||{};
    const summaryPoints=Array.isArray(summary.points)?summary.points.map(x=>`<li>${esc(x)}</li>`).join(''):'';
    const practical=lesson.payload?.practical||lesson.practical||{};
    const checklist=Array.isArray(practical.checklist)?practical.checklist.map(x=>`<li>${esc(x)}</li>`).join(''):'';
    const testId=lesson.lessonTestId||lesson.assessment?.assessmentCode||null;
    const lecture=lesson.payload?.lecture?.script||lesson.payload?.lectureScript||lesson.lecture?.script||'';
    panel.innerHTML=`<div class="lesson-heading"><h2>📖 ${esc(lesson.title)}</h2><span class="chip">Bài học theo từng phần</span></div><p class="muted">${esc(lesson.description||'')}</p><div class="meta"><span class="chip">${esc((lesson.theorySections||[]).length)} phần kiến thức</span><span class="chip">${esc(lesson.questionCount||lesson.assessment?.questionCount||0)} câu luyện tập</span><span class="chip">${esc(lesson.estimatedMinutes||45)} phút dự kiến</span></div><div class="learning-flow"><span>1 · Hiểu khái niệm</span><span>2 · Xem ví dụ</span><span>3 · Tự làm</span><span>4 · Kiểm tra</span></div><div class="rich-columns"><div class="rich-lesson"><article class="ai-v18-card"><h3>🎯 Học xong bạn làm được gì?</h3><ul>${(lesson.objectives||lesson.learningOutcomes||[]).map(x=>`<li>${esc(x?.description||x)}</li>`).join('')}</ul></article><details class="theory-block" open><summary><span>👨‍🏫 Bài giảng tóm tắt</span><small>Trước khi đọc</small></summary><div class="theory-content">${readableText(lecture)}</div></details><section class="ai-v18-card"><h3>📚 Lý thuyết theo từng phần</h3><p class="muted">Mở phần đang học trước; các phần khác có thể xem lại sau. Mỗi phần được tách đoạn ngắn để dễ đọc trên màn hình.</p><div class="rich-lesson">${theory}</div></section><details class="theory-block"><summary><span>💡 Ví dụ có hướng dẫn</span><small>${(lesson.examples||[]).length} ví dụ</small></summary><div class="theory-content"><ul>${examples}</ul></div></details><details class="theory-block"><summary><span>📝 Luyện tập</span><small>${(lesson.payload?.practiceTasks||lesson.practiceTasks||[]).length} nhiệm vụ</small></summary><div class="theory-content"><div class="practice-task-grid">${practice||'<p class="muted">Bài này chưa có nhiệm vụ luyện tập được biên tập riêng.</p>'}</div>${isProgrammingLesson?`<section id="${esc(practiceRootId)}" class="algorithm-practice-mount"></section>`:''}</div></details><details class="theory-block"><summary><span>🧪 Thực hành / Lab / Project</span><small>${practical.points?`${esc(practical.points)} điểm`:'Theo checklist'}</small></summary><div class="theory-content"><h4>${esc(practical.title||practical.kind||'Nhiệm vụ vận dụng')}</h4>${readableText(practical.task||practical.instructions||'Hãy áp dụng kiến thức vừa học vào một nhiệm vụ cụ thể và ghi nhận kết quả kiểm chứng.')} ${practical.inputFormat?`<div class="practice-spec"><strong>Đầu vào/tài nguyên</strong><p>${esc(practical.inputFormat)}</p></div>`:''}${practical.expectedOutput||practical.deliverable?`<div class="practice-spec"><strong>Sản phẩm đầu ra</strong><p>${esc(practical.expectedOutput||practical.deliverable)}</p></div>`:''}${checklist?`<h4>Checklist thực hiện</h4><ol>${checklist}</ol>`:''}${renderPracticalCriteria(practical)}</div></details><details class="theory-block"><summary><span>⚠️ Lỗi thường gặp</span><small>Ôn trước bài test</small></summary><div class="theory-content"><ul>${mistakes}</ul></div></details><details class="theory-block"><summary><span>✅ Tóm tắt cần nhớ</span><small>Ôn nhanh</small></summary><div class="theory-content"><ul>${summaryPoints}</ul></div></details><details class="theory-block"><summary><span>🔎 Tự kiểm tra kiến thức</span><small>${(lesson.payload?.quickChecks||lesson.quickChecks||[]).length} câu hỏi</small></summary><div class="theory-content"><ul>${checks}</ul></div></details></div><aside class="rich-lesson"><div id="lesson-tools-${esc(lesson._id||lesson.id)}"></div><div id="typed-content-${esc(lesson._id||lesson.id)}" hidden></div><article class="ai-v18-card"><h3>📈 Tiến độ bài học</h3>${window.HtmLessonProgress?.render(lesson)||'<p class="muted">Đang tải tiến độ…</p>'}</article><div id="local-ai-tutor-${esc(lesson._id||lesson.id)}"></div>${lesson.audioAssetId?`<article class="ai-v18-card"><h3>🎧 Audio</h3><audio controls src="/api/ai-learning/audio/${encodeURIComponent(lesson.audioAssetId)}"></audio></article>`:''}<img id="lesson-image-${lesson._id||lesson.id}" class="ai-v18-image" style="display:none" alt="Minh họa bài học"><article class="ai-v18-card"><h3>${testId?'✅ Kiểm tra bài học':'⚠️ Chưa có bài kiểm tra riêng'}</h3>${testId?`<p><a class="button button-primary" href="assessment.html?id=${encodeURIComponent(testId)}">Bắt đầu kiểm tra</a></p>`:''}<p class="muted">Làm bài sau khi hoàn thành các phần kiến thức và luyện tập.</p></article></aside></div>`;
    mountAssignmentForms(lesson);
    const tools=document.getElementById(`lesson-tools-${lesson._id||lesson.id}`);
    if(isProgrammingLesson){const practiceRoot=document.getElementById(practiceRootId);window.HtmAlgorithmPractice?.mount(practiceRoot,{course:data.course,lesson});if(tools)tools.innerHTML='<p class="muted">Bộ chấm code nằm trong phần Luyện tập của bài học. Mỗi bài hiển thị input/output, test công khai, rubric và kết quả chấm.</p>';}else{window.HtmCodePlayground?.mount(tools,{course:data.course,lesson});}
    loadTypedContentBlocks(lesson);
    window.HtmLessonProgress?.mount(panel,lesson,data.course);
    const tutor=document.getElementById(`local-ai-tutor-${lesson._id||lesson.id}`);
    window.HtmLocalAITutor?.mount(tutor,{course:data.course,lesson});
    ensureMedia(lesson);
  }
  function mountAssignmentForms(lesson){
    const lessonId=String(lesson._id||lesson.id||'');
    panel.querySelectorAll('[data-assignment-submission]').forEach(form=>form.addEventListener('submit',async event=>{
      event.preventDefault();
      const button=form.querySelector('button[type="submit"]');
      const status=form.querySelector('[data-assignment-status]');
      const fields=new FormData(form);
      if(button)button.disabled=true;
      if(status)status.textContent='Đang gửi bài…';
      try{
        const submissionText=String(fields.get('submissionText')||'').trim();
        const submissionUrl=String(fields.get('submissionUrl')||'').trim();
        const file=form.querySelector('[name="submissionFile"]')?.files?.[0]||null;
        if(submissionText.length>0&&submissionText.length<10&&!file&&!submissionUrl)throw new Error('Lời giải cần ít nhất 10 ký tự, hoặc hãy nộp tệp/liên kết sản phẩm.');
        if(submissionText.length<10&&!file&&!submissionUrl)throw new Error('Hãy nhập lời giải, chọn tệp sản phẩm hoặc cung cấp liên kết.');
        if(file&&file.size>3*1024*1024)throw new Error('Tệp vượt quá giới hạn 3 MB.');
        let attachmentId='';
        if(file){if(status)status.textContent='Đang tải tệp nhị phân lên…';const uploaded=await HanhTrinhApi.uploadBinary('/api/learning/assignments/attachment',file);attachmentId=uploaded.id}
        if(status)status.textContent='Đang nộp bài…';
        const result=await HanhTrinhApi.post('/api/learning/assignments/submit',{courseId:String(data.course?._id||data.course?.id||''),courseCode:String(data.course?.code||''),lessonId,taskTitle:form.dataset.taskTitle||'Bài luyện tập',taskIndex:Number(form.dataset.taskIndex||0),submissionText,submissionUrl,attachmentId});
        if(status)status.textContent=`${result.message||'Đã nộp bài.'} Trạng thái: ${result.status||'SUBMITTED'}.`;
        form.reset();
      }catch(error){if(status)status.textContent=error.message||'Không thể nộp bài. Vui lòng thử lại.'}
      finally{if(button)button.disabled=false}
    }));
    HanhTrinhApi.get(`/api/learning/assignments/my-submissions?lessonId=${encodeURIComponent(lessonId)}`).then(items=>{
      const submissions=Array.isArray(items)?items:[];
      panel.querySelectorAll('[data-assignment-submission]').forEach(form=>{
        const prior=submissions.find(item=>Number(item.taskIndex)===Number(form.dataset.taskIndex||0)&&item.taskTitle===form.dataset.taskTitle);
        if(!prior)return;
        const status=form.querySelector('[data-assignment-status]');
        if(status)status.textContent=prior.status==='GRADED'?`Đã chấm: ${prior.score}/100. Nhận xét: ${prior.feedback||'Chưa có nhận xét.'}`:`Bài đã nộp lúc ${new Date(prior.submittedAt).toLocaleString('vi-VN')}. Trạng thái: ${prior.status==='RETURNED'?'Cần chỉnh sửa':'đang chờ chấm'}.`;
      });
    }).catch(()=>{});
  }
  async function ensureMedia(lesson){
    const lessonId=String(lesson._id||'');
    if(!/^[a-f0-9]{24}$/i.test(lessonId))return;
    const attempts=mediaPollAttempts.get(lessonId)||0;
    if(attempts>=4)return;
    try{
      const media=await HanhTrinhApi.get(`/api/ai-learning/lessons/${encodeURIComponent(lessonId)}/media`);
      if(media.audioAssetId&&!lesson.audioAssetId){mediaPollAttempts.delete(lessonId);lesson.audioAssetId=media.audioAssetId;openLesson(lesson._id);return}
      if(media.imageAssetId){const image=document.getElementById(`lesson-image-${lesson._id}`);if(image){image.src=`/api/ai-learning/images/${encodeURIComponent(media.imageAssetId)}`;image.style.display='block'}}
      const statuses=[media.audioStatus,media.imageStatus].map(value=>String(value||'').toUpperCase());
      const pending=statuses.some(value=>['QUEUED','PENDING','PROCESSING','GENERATING'].includes(value));
      if(pending&&attempts<3){mediaPollAttempts.set(lessonId,attempts+1);setTimeout(()=>ensureMedia(lesson),Math.min(45000,10000*(attempts+1)))}else mediaPollAttempts.delete(lessonId);
    }catch(_){if(attempts<1){mediaPollAttempts.set(lessonId,attempts+1);setTimeout(()=>ensureMedia(lesson),12000)}else mediaPollAttempts.delete(lessonId)}
  }
  async function load(){
    const id=new URLSearchParams(location.search).get('id');
    if(!id){root.innerHTML='<section class="flow-card"><h2>Thiếu mã khóa học.</h2></section>';return}
    try{
      data=await HanhTrinhApi.course(id);
      const course=data.course||{};
      const chapters=Array.isArray(data.chapters)&&data.chapters.length?data.chapters:(data.units||[]).map((unit,index)=>({order:index+1,title:unit.title||unit.unit,description:`Chủ đề ${index+1}`,lessons:unit.lessons||[],test:unit.test||null}));
      const academic=course.academicDomainName||course.syllabus?.academic?.academicDomainName;
      const faculty=course.facultyName||course.syllabus?.academic?.facultyName;
      const pathDesign=course.pathDesign||course.syllabus?.pathDesign||{};
      root.innerHTML=`<section class="detail-hero"><span class="eyebrow">${esc(academic||course.gradeName||course.targetExam||course.syllabus?.track||course.category||'COURSE')} · ${esc(course.educationLevelName||course.educationLevel||'')}</span><h1>${esc(course.name||course.title)}</h1><p class="muted">${esc(course.description||'')}</p>${faculty?`<p class="muted"><strong>${esc(faculty)}</strong> · Danh mục kỹ năng tham chiếu, không phải chương trình chính thức của trường.</p>`:''}<div class="meta"><span class="chip">${esc(course.gradeName||course.educationLevelName||course.educationLevel||'')}</span><span class="chip">${esc(course.lessonCount||0)} bài học</span><span class="chip">${esc(course.questionCount||course.syllabus?.questionCount||0)} câu hỏi</span>${course.syllabus?.targetExam?`<span class="chip">${esc(course.syllabus.targetExam)} · ${esc(course.syllabus.targetVariant||'')}</span>`:''}</div>${pathDesign.stages?.length?`<div class="course-summary-grid">${pathDesign.stages.slice(0,4).map((stage,index)=>`<div><strong>Chặng ${index+1}</strong><small>${esc(stage)}</small></div>`).join('')}</div>`:''}</section>${chapters.map((ch,chIndex)=>`<details class="module chapter-accordion" ${chIndex===0?'open':''}><summary><span>${esc(ch.title||'Module')}<small class="muted" style="display:block;font-weight:400;margin-top:4px">${esc(ch.description||'')}</small></span><span class="chip">${(ch.lessons||[]).length} bài</span></summary><div class="chapter-content">${(ch.lessons||[]).map(lesson=>{const testId=lesson.lessonTestId||lesson.assessment?.assessmentCode;const currentTrack=course.track||course.syllabus?.track;const currentExam=course.targetExam||course.syllabus?.targetExam;const activityLabels=course.academicDomainCode==='COMPUTING'||course.syllabus?.academic?.academicDomainCode==='COMPUTING'?['Lý thuyết ngắn','Code Lab','Test case']:currentExam==='TOEIC'||currentExam==='IELTS'?['Bài giảng','Practice','Timed test']:currentTrack==='MOS'?['Hướng dẫn','Thực hành','Checklist']:['Kiến thức','Ví dụ','Luyện tập','Test'];return `<article class="lesson"><h3>${esc(lesson.title)}</h3><p class="muted">${esc(lesson.description||'')}</p><div class="meta"><span class="chip">${esc(lesson.estimatedMinutes||25)} phút</span><span class="chip">${esc(lesson.theorySectionCount||lesson.theorySections?.length||0)} phần học</span><span class="chip">${esc(lesson.questionCount||lesson.assessment?.questionCount||0)} câu</span></div><div class="activity-list">${activityLabels.map(label=>`<span class="chip">${esc(label)}</span>`).join('')}</div><div class="lesson-actions">${lesson.locked?`<button class="button button-secondary" type="button" disabled aria-disabled="true">🔒 Chưa mở khóa</button><small class="muted">${esc(lesson.lockReason||'Hoàn thành bài trước và đạt bài kiểm tra để tiếp tục.')}</small>`:`<button class="button button-secondary" data-lesson="${esc(lesson._id||lesson.id)}">Bắt đầu bài học →</button>${testId?`<a class="button button-primary button-small" href="assessment.html?id=${encodeURIComponent(testId)}">Kiểm tra bài</a>`:''}`}</div></article>`}).join('')}${ch.test?`<div style="margin-top:10px">${assessment(ch.test)}</div>`:''}</div></details>`).join('')}<details class="module chapter-accordion"><summary><span>📋 Kiểm tra tổng hợp<small class="muted" style="display:block;font-weight:400;margin-top:4px">Giữa kỳ, cuối khóa và mô phỏng nếu đã có trong chương trình</small></span><span class="chip">Đánh giá</span></summary><div class="chapter-content">${data.midtermAssessment?assessment(data.midtermAssessment):''}${data.finalAssessment?assessment(data.finalAssessment):''}${data.mockAssessment?assessment(data.mockAssessment):''}${data.chapterAssessments?.length?data.chapterAssessments.map(assessment).join(''):''}${!data.midtermAssessment&&!data.finalAssessment&&!data.mockAssessment&&!data.chapterAssessments?.length?'<p class="muted">Các bài kiểm tra được mở từ từng bài/chủ đề.</p>':''}</div></details>`;
      root.querySelectorAll('[data-lesson]').forEach(btn=>btn.onclick=()=>openLesson(btn.dataset.lesson));
    }catch(e){root.innerHTML=`<section class="flow-card"><h2>Không thể tải khóa học</h2><p class="muted">${esc(e.message||'Lỗi không xác định.')}</p></section>`}
  }
  load();
})();
</script><script src="assets/js/ai-autopilot.js?v=39.0.0"></script></body></html>
