<style>
body{min-height:100vh;margin:0;background:linear-gradient(145deg,#eef6ff,#f7fff5);display:grid;place-items:center;padding:20px;box-sizing:border-box}.status-card{width:min(720px,100%);background:#fff;border-radius:24px;box-shadow:0 18px 60px rgba(27,50,80,.16);padding:28px}.status-card h1{margin-top:0}.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.status-item{border:1px solid #dce6f2;border-radius:16px;padding:16px;background:#f8fbff}.status-item b{display:block;font-size:1.05rem}.good{color:#177245}.warn{color:#9a6500}.bad{color:#a92f28}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a,.actions button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;text-decoration:none;background:#315fe9;color:#fff}.actions a.secondary{background:#eef3ff;color:#2448ae}.technical{white-space:pre-wrap;background:#111827;color:#d9e6ff;padding:14px;border-radius:14px;max-height:220px;overflow:auto;font:13px/1.5 ui-monospace,monospace}
</style>

</head>
<body><main class="status-card"><h1>🩺 Trạng thái hệ thống</h1><p>Trang này vẫn mở được khi kho dữ liệu hoặc phiên đăng nhập đang kết nối lại.</p><div class="status-grid"><div class="status-item"><span>Máy chủ Node</span><b id="node">Đang kiểm tra…</b></div><div class="status-item"><span>Cơ sở dữ liệu</span><b id="db">Đang kiểm tra…</b></div><div class="status-item"><span>Phiên bản</span><b id="version">—</b></div><div class="status-item"><span>Mã yêu cầu</span><b id="request">—</b></div></div><p id="advice">Vui lòng chờ.</p><div class="actions"><button id="retry" type="button">Kiểm tra lại</button><a href="login.html" class="secondary">Về đăng nhập</a><a href="index.html" class="secondary">Về trang chủ</a></div><h2>Thông tin kỹ thuật</h2><div id="technical" class="technical">Chưa có dữ liệu.</div></main>
<script>
(async()=>{const $=id=>document.getElementById(id);async function check(){['node','db'].forEach(id=>{$(id).textContent='Đang kiểm tra…';$(id).className=''});$('advice').textContent='Đang liên hệ máy chủ…';try{const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);const r=await fetch('/api/health',{cache:'no-store',signal:c.signal});clearTimeout(t);const d=await r.json().catch(()=>({}));$('node').textContent=r.ok?'Đang hoạt động':'Có lỗi';$('node').className=r.ok?'good':'bad';$('db').textContent=d.database==='connected'?'Đã kết nối':'Đang kết nối lại';$('db').className=d.database==='connected'?'good':'warn';$('version').textContent=d.version||'Không rõ';$('request').textContent=r.headers.get('x-request-id')||'—';$('advice').textContent=d.database==='connected'?'Hệ thống sẵn sàng. Bạn có thể đăng nhập và tiếp tục.':'Máy chủ còn sống nhưng kho dữ liệu chưa sẵn sàng. Không nên nộp bài hoặc chơi online cho đến khi kết nối lại.';$('technical').textContent=JSON.stringify(d,null,2)}catch(e){$('node').textContent='Không liên hệ được';$('node').className='bad';$('db').textContent='Không xác định';$('db').className='bad';$('advice').textContent=navigator.onLine?'Render chưa phản hồi. Hãy xem Deploy Logs rồi thử lại.':'Thiết bị đang mất mạng.';$('technical').textContent=String(e.message||e)}}$('retry').onclick=check;check()})();
</script><script src="modern-ui.js"></script><script src="assets/ui/ui-v11.js"></script><script src="assets/ui/connection-v13.js"></script><script src="assets/js/ai-autopilot.js?v=39.0.0"></script>
</body></html>
