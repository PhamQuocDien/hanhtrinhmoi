<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chương trình — Quản trị</title>
    <link rel="stylesheet" href="/assets/css/education.css">
</head>
<body>
    <main class="page">
        <h1 class="page-title">Chương trình lớp 1–12</h1>
        <p class="page-subtitle">
            Cấu trúc chương trình đang được dùng: lớp → môn → bộ sách → chương → bài học.
        </p>

        <div class="filter-bar">
            <label class="field" for="grade">
                <span class="field-label">Lớp</span>
                <select id="grade"></select>
            </label>
            <label class="field" for="keyword">
                <span class="field-label">Tìm môn</span>
                <input type="search" id="keyword" placeholder="Nhập tên môn…">
            </label>
        </div>

        <div id="curriculum-root" aria-busy="true">
            <p class="loading-text">Đang tải chương trình…</p>
        </div>
    </main>

    <script type="module" src="/assets/js/admin/curriculum.js"></script>
</body>
</html>
