<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài học — Quản trị</title>
    <link rel="stylesheet" href="/assets/css/education.css">
</head>
<body>
    <main class="page">
        <h1 class="page-title">Bài học</h1>
        <p class="page-subtitle">
            Danh sách bài học theo lớp và môn, kèm trạng thái nội dung và xác minh.
        </p>

        <div class="filter-bar">
            <label class="field" for="grade">
                <span class="field-label">Lớp</span>
                <select id="grade"></select>
            </label>
            <label class="field" for="subjectId">
                <span class="field-label">Môn</span>
                <select id="subjectId"><option value="">Tất cả môn</option></select>
            </label>
            <label class="field" for="status">
                <span class="field-label">Trạng thái</span>
                <select id="status">
                    <option value="">Tất cả</option>
                    <option value="empty">Chưa có nội dung</option>
                    <option value="pending">Chờ đối chiếu</option>
                </select>
            </label>
        </div>

        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th scope="col">Mã bài</th>
                        <th scope="col">Tên bài</th>
                        <th scope="col">Chương</th>
                        <th scope="col">Nội dung</th>
                        <th scope="col">Xác minh</th>
                    </tr>
                </thead>
                <tbody id="lessons-body">
                    <tr><td colspan="5" class="muted">Đang tải…</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="/assets/js/admin/lessons.js"></script>
</body>
</html>
