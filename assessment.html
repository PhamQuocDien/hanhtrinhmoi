    .assessment-question{padding:16px;border:1px solid #d9e2ec;border-radius:12px;background:#fff}.assessment-question legend{font-weight:800;color:#102a43;margin-bottom:10px}.assessment-question label{display:flex;gap:9px;padding:9px;border-radius:8px}.assessment-question label:has(input:checked){background:#eff6ff}.assessment-meta{display:flex;gap:10px;flex-wrap:wrap;color:#52718b;font-size:.9rem}.text-input,.code-input,.assessment-question select{width:100%;box-sizing:border-box;border:1px solid #ccd6e0;border-radius:10px;padding:10px;font:inherit}.code-input{font-family:Consolas,monospace;background:#0f172a;color:#f8fafc}.assessment-order{padding-left:24px}.assessment-order li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px;border:1px solid #e1e8ef;border-radius:8px;margin:6px 0;background:#f8fbff}.assessment-match{justify-content:space-between;align-items:center}.assessment-note{padding:10px;border-radius:8px;background:#f5f8fb;color:#52718b;margin:8px 0}.assessment-case{border:1px solid #e1e8ef;border-radius:8px;padding:8px;margin:6px 0}.assessment-output{white-space:pre-wrap;border-radius:8px;background:#0f172a;color:#f8fafc;padding:10px;min-height:50px}.code-toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.assessment-speaking{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.assessment-passage{padding:14px;background:#f8fafc;border-left:4px solid #93a4b8;border-radius:8px;white-space:pre-wrap;margin:8px 0}.assessment-list{display:grid;gap:10px}.assessment-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid #d9e2ec;border-radius:12px;background:#fff}.assessment-card small{display:block;color:#6b7c93;margin-top:5px}@media(max-width:650px){.assessment-card{align-items:flex-start;flex-direction:column}}
  </style>

<body class="flow-page">
  <main class="flow-shell">
    <header class="flow-top"><div><a href="index.html">← Learning Hub</a><h1>Bài kiểm tra</h1></div><a href="lo-trinh-hoc-tap.html">Lộ trình →</a></header>
    <section id="catalog-panel" class="flow-card"><span class="eyebrow">ASSESSMENT CATALOG</span><h2>Chọn bài kiểm tra đã công bố</h2><p id="catalog-status" class="flow-status">Đang tải assessment thật từ platform catalog…</p><div id="assessment-list" class="assessment-list"></div></section>
    <section id="test-panel" class="flow-card" hidden><div class="flow-top"><div><a href="#" id="back-catalog">← Danh sách bài</a><h2 id="test-title">Bài kiểm tra</h2></div><strong id="timer">--:--</strong></div><div id="test-meta" class="assessment-meta"></div><form id="assessment-form" class="flow-form"></form><div class="flow-actions"><button id="submit-test" class="button button-primary" type="button">Nộp bài</button><span id="test-status" class="flow-status"></span></div></section>
    <section id="result-panel" class="flow-card" hidden><span class="eyebrow">RESULT</span><h2 id="result-title">Kết quả</h2><p id="result-summary" class="flow-status"></p><div id="result-review" class="data-list"></div><a class="button button-secondary" href="lo-trinh-hoc-tap.html">Tiếp tục học</a></section>
  </main>
  <script src="assets/js/api.js?v=39.0.0"></script>
  <script src="assets/platform/account-menu.js"></script>
  <script>
    (()=>{
      const api=window.HanhTrinhApi,$=id=>document.getElementById(id),setHidden=(id,value)=>{const el=$(id);if(el)el.hidden=Boolean(value)},esc=v=>String(v??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])),items=v=>Array.isArray(v?.items)?v.items:Array.isArray(v)?v:[];
      let current,attempt,interval=0,autosaveTimer=0,autosaveInFlight=Promise.resolve(),lastSavedAnswers='',recordings={},isSubmitting=false,codeRunnerStatus=null;
      const required=['catalog-panel','catalog-status','assessment-list','test-panel','result-panel','test-status','test-title','test-meta','assessment-form','submit-test','timer','result-title','result-summary','result-review','back-catalog'];
      if(!api||required.some(id=>!$(id)))return;
      const message=(text,error=false)=>{$('test-status').textContent=text;$('test-status').style.color=error?'#b42318':'#52718b'};
      const optionText=(value,depth=0)=>{if(depth>5||value==null)return '';if(['string','number','boolean'].includes(typeof value))return String(value);if(Array.isArray(value))return value.map(item=>optionText(item,depth+1)).filter(Boolean).join(' / ');if(typeof value==='object'){for(const key of ['label','text','title','name','value','id','content','description']){if(value[key]!==undefined&&value[key]!==null){const text=optionText(value[key],depth+1);if(text)return text}}}return ''};
      const optionLabel=o=>optionText(o?.label??o?.text??o?.title??o?.left??o?.value??o?.id??o);
      const optionValue=o=>optionText(o?.value??o?.id??o?.left??o?.label??o?.text??o);
      const questionId=q=>String(q?._id||q?.id||q?.code||'');
      const typeOf=q=>{const raw=String(q?.type||'single_choice').toLowerCase().replace(/[ -]+/g,'_');return ({mcq:'single_choice',single_select:'single_choice',choice:'single_choice',multiple_select:'multiple_choice',multi_select:'multiple_choice',checkbox:'multiple_choice',tf:'true_false',truefalse:'true_false',boolean:'true_false',blank:'fill_blank',shortanswer:'short_answer',order:'ordering',sequence:'ordering',sort:'ordering',match:'matching',pairing:'matching',code:'coding',programming:'coding',essay_question:'essay',practical_task:'practical'})[raw]||raw;};
      const radio=(q,i,multiple=false)=>`<div class="assessment-options">${(q.options||[]).map((o,j)=>{const inputId=`choice-${questionId(q)}-${j}`;return `<label class="assessment-choice" for="${esc(inputId)}"><input id="${esc(inputId)}" ${multiple?'type="checkbox"':'type="radio"'} name="${esc(questionId(q))}" value="${esc(String(optionValue(o)))}" ${multiple?'':'required'}><span class="assessment-choice-text">${esc(optionLabel(o))}</span></label>`}).join('')}</div>`;
      const typeNames={single_choice:'Trắc nghiệm · 1 đáp án',multiple_choice:'Trắc nghiệm · nhiều đáp án',true_false:'Đúng / Sai',fill_blank:'Điền khuyết',short_answer:'Trả lời ngắn',numerical:'Nhập số',ordering:'Sắp xếp thứ tự',matching:'Ghép đôi',essay:'Tự luận',reading_comprehension:'Đọc hiểu',listening:'Nghe hiểu',speaking:'Nói',image_based:'Câu hỏi hình ảnh',coding:'Lập trình có chấm test',practical:'Thực hành · nộp minh chứng',timed_simulation:'Mô phỏng có giới hạn thời gian'};
      function criteriaList(value){const list=Array.isArray(value)?value:Array.isArray(value?.criteria)?value.criteria:Object.entries(value||{}).map(([name,detail])=>typeof detail==='object'?{name,...detail}:{name,description:detail});return list.map(item=>{if(typeof item==='string')return `<li>${esc(item)}</li>`;const name=item.name||item.title||item.criterion||'Tiêu chí';const weight=item.weight??item.points??item.score;return `<li>${esc(name)}${weight!==undefined?` · ${esc(weight)} điểm`:''}${item.description?`: ${esc(item.description)}`:''}</li>`}).join('')}
      function rubricGuide(q,type,media={}){
        const c=media.coding||media,criteria=criteriaList(c.scoringCriteria||q.rubric||media.rubric);
        if(type==='coding')return `<div class="assessment-score-guide"><h4>📊 Cách chấm điểm · ${esc(q.points??100)} điểm tối đa</h4><p>Điểm tự động tính theo trọng số các test công khai và test ẩn. Mỗi test có trọng số riêng (mặc định 1); chấm theo công thức: tổng trọng số test đạt ÷ tổng trọng số toàn bộ test × điểm tối đa.</p>${criteria?`<strong>Tiêu chí bổ sung</strong><ul>${criteria}</ul>`:''}<small>Test công khai hiển thị ví dụ để tự kiểm tra. Test ẩn chỉ trả số lượng đạt, không tiết lộ dữ liệu hoặc đáp án.</small></div>`;
        if(['practical','timed_simulation','essay','speaking'].includes(type))return `<div class="assessment-score-guide"><h4>📊 Cách đánh giá · ${esc(q.points??'Chưa đặt')} điểm tối đa</h4>${criteria?`<strong>Rubric/tiêu chí chấm</strong><ul>${criteria}</ul>`:'<p>Bài tự luận/thực hành sẽ được chấm tự động bằng rubric nội bộ theo mức độ liên quan, đầy đủ, cấu trúc và bằng chứng. Đây là điểm hỗ trợ học tập, không thay thế chứng nhận chuyên môn.</p>'}</div>`;
        return '';
      }
      function renderQuestion(q,i){
        const id=questionId(q),type=typeOf(q),media=q.media||{},points=Number(q.points??1),common=`<fieldset class="assessment-question" data-question-id="${esc(id)}"><legend><span class="question-prompt">Câu ${i+1}: ${esc(q.prompt)}</span><span class="question-points">${Number.isFinite(points)?esc(points):1} điểm</span></legend><span class="question-type-badge">${esc(typeNames[type]||type)}</span>`;
        if(type==='single_choice'||type==='image_based'||type==='reading_comprehension'||type==='listening'){
          let extra='';
          if(type==='image_based'&&media.url)extra=`<img src="${esc(media.url)}" alt="Hình câu hỏi" style="max-width:100%;height:auto;border-radius:10px;margin:8px 0">`;
          if(type==='reading_comprehension'&&media.passage)extra=`<div class="assessment-passage">${esc(media.passage)}</div>`;
          if(type==='listening'&&media.audioUrl)extra=`<audio controls preload="none" src="${esc(media.audioUrl)}" style="width:100%;margin:8px 0"></audio>`;
          if(type==='listening'&&!media.audioUrl)extra='<div class="assessment-note">Chưa có audio gắn vào câu hỏi này. Không có audio thì đây chưa phải bài nghe hoàn chỉnh.</div>';
          return common+extra+radio(q,i)+`</fieldset>`;
        }
        if(type==='multiple_choice')return common+`<div class="assessment-note">Chọn tất cả đáp án đúng.</div>`+radio(q,i,true)+`</fieldset>`;
        if(type==='true_false'){
          const options=[{label:'Đúng',value:'true'},{label:'Sai',value:'false'}];
          return common+`<div class="assessment-options">${options.map((o,j)=>`<label class="assessment-choice" for="choice-${esc(id)}-${j}"><input id="choice-${esc(id)}-${j}" required type="radio" name="${esc(id)}" value="${o.value}"><span class="assessment-choice-text">${o.label}</span></label>`).join('')}</div></fieldset>`;
        }
        if(type==='fill_blank')return common+`<label class="assessment-field-label" for="answer-${esc(id)}">Đáp án của bạn</label><input id="answer-${esc(id)}" required class="text-input" name="${esc(id)}" placeholder="Nhập từ/cụm từ còn thiếu…">`+`</fieldset>`;
        if(type==='numerical')return common+`<label class="assessment-field-label" for="answer-${esc(id)}">Kết quả số</label><input id="answer-${esc(id)}" required class="text-input" type="number" step="any" name="${esc(id)}" placeholder="Nhập giá trị số…">`+`</fieldset>`;
        if(type==='short_answer')return common+`<label class="assessment-field-label" for="answer-${esc(id)}">Câu trả lời</label><textarea id="answer-${esc(id)}" required class="text-input" name="${esc(id)}" rows="4" placeholder="Trả lời ngắn, nêu ý chính…"></textarea></fieldset>`;
        if(type==='essay')return common+`<label class="assessment-field-label" for="answer-${esc(id)}">Bài làm</label><textarea id="answer-${esc(id)}" required class="text-input" name="${esc(id)}" rows="9" placeholder="Trình bày luận điểm, lập luận và dẫn chứng…"></textarea>`+rubricGuide(q,type,media)+`</fieldset>`;
        if(type==='ordering'){
          const opts=(q.options||[]).map(o=>({label:String(optionLabel(o)),value:String(optionValue(o))})).filter(o=>o.label);const list=opts.map((o,j)=>`<li data-order-item="${esc(id)}" data-value="${esc(o.value)}"><span>${esc(o.label)}</span><span class="assessment-order-actions"><button type="button" class="button button-small" data-up="${esc(id)}" data-index="${j}" aria-label="Đưa lên">↑</button> <button type="button" class="button button-small" data-down="${esc(id)}" data-index="${j}" aria-label="Đưa xuống">↓</button></span></li>`).join('');
          return common+`<p class="assessment-note">Sắp xếp từ trên xuống theo thứ tự đúng. Dùng nút ↑ ↓, rồi kiểm tra thứ tự trước khi nộp.</p><ol class="assessment-order" id="order-${esc(id)}">${list}</ol></fieldset>`;
        }
        if(type==='matching'){
          const left=(q.options||[]).map((o,j)=>({label:String(optionLabel(o)),value:String(optionValue(o)||j)}));const rights=Array.isArray(media.matchingOptions)?media.matchingOptions:[];
          return common+`<p class="assessment-note">Chọn nội dung tương ứng cho từng dòng. Nếu đề không cung cấp danh sách lựa chọn, hãy nhập câu ghép phù hợp vào ô trả lời.</p><div class="assessment-match-list">${left.map((item,j)=>`<label class="assessment-match"><span>${esc(item.label)}</span>${rights.length?`<select name="match:${esc(id)}:${j}" required><option value="">-- Chọn cặp tương ứng --</option>${rights.map(r=>`<option value="${esc(String(r))}">${esc(r)}</option>`).join('')}</select>`:`<input class="text-input" name="match:${esc(id)}:${j}" required placeholder="Nhập nội dung tương ứng…">`}</label>`).join('')}</div></fieldset>`;
        }
        if(type==='coding'){
          const c=media.coding||media,pub=Array.isArray(c.publicTestCases)?c.publicTestCases:Array.isArray(c.visibleTestCases)?c.visibleTestCases:[];
          const cases=pub.map((t,j)=>`<div class="assessment-case"><strong>Test công khai ${j+1} · Trọng số ${esc(t.weight??1)}</strong><div class="algorithm-sample-grid"><div><span>Input</span><pre>${esc(t.input||'')}</pre></div><div><span>Output mong đợi</span><pre>${esc(t.expectedOutput||t.output||'')}</pre></div></div></div>`).join('');
          const languages=Array.isArray(c.supportedLanguages)&&c.supportedLanguages.length?c.supportedLanguages:['cpp','python','javascript'];
          return common+`<div class="assessment-note"><strong>Đề bài</strong><p>${esc(c.statement||q.prompt||'Hoàn thành chương trình theo yêu cầu.')}</p><p><strong>Input:</strong> ${esc(c.inputFormat||'Đọc dữ liệu từ stdin theo đề bài.')}</p><p><strong>Output:</strong> ${esc(c.outputFormat||'In kết quả theo đúng định dạng đề bài.')}</p>${Array.isArray(c.constraints)&&c.constraints.length?`<p><strong>Ràng buộc:</strong> ${esc(c.constraints.join(' · '))}</p>`:''}</div>${rubricGuide(q,type,media)}${cases?`<div class="assessment-public-cases"><h4>Ví dụ để tự kiểm tra</h4>${cases}</div>`:''}<div class="assessment-code-editor"><div class="code-toolbar"><label>Ngôn ngữ lập trình<select data-coding-language="${esc(id)}">${languages.map(lang=>`<option value="${esc(lang)}" ${(lang===(c.language||'cpp'))?'selected':''}>${esc(({cpp:'C++17',c:'C11',java:'Java',python:'Python',javascript:'JavaScript'})[lang]||lang)}</option>`).join('')}</select></label><button type="button" class="button button-secondary button-small" data-run-code="${esc(id)}">▶ Chạy thử với input mẫu</button></div><label class="assessment-field-label" for="code-${esc(id)}">Mã nguồn của bạn</label><textarea id="code-${esc(id)}" class="code-input" spellcheck="false" autocapitalize="off" data-coding-editor="${esc(id)}" rows="16">${esc(c.starterCode||c.codeTemplate||'// Viết lời giải tại đây\n')}</textarea><label class="assessment-field-label" for="stdin-${esc(id)}">Input tự thử</label><textarea id="stdin-${esc(id)}" class="text-input" data-coding-stdin="${esc(id)}" rows="3" placeholder="Nhập dữ liệu đầu vào để chạy thử…"></textarea><h4>Kết quả chạy thử</h4><pre class="assessment-output" data-coding-output="${esc(id)}" aria-live="polite">Chưa chạy. “Chạy thử” chỉ kiểm tra input hiện tại; điểm chính thức được tính khi nộp bài qua bộ test của đề.</pre></div></fieldset>`;
        }
        if(type==='speaking')return common+`<div class="assessment-speaking"><button type="button" class="button button-secondary" data-record="${esc(id)}">🎙 Bắt đầu thu âm</button><span data-record-status="${esc(id)}">Chưa thu âm.</span></div><label class="assessment-field-label" for="answer-${esc(id)}">Bản ghi/tóm tắt dự phòng</label><textarea id="answer-${esc(id)}" class="text-input" name="${esc(id)}" rows="4" placeholder="Chỉ dùng nếu không thể thu âm…"></textarea>`+rubricGuide(q,type,media)+`</fieldset>`;
        if(type==='practical'||type==='timed_simulation'){
          const m=media,steps=Array.isArray(m.steps)?m.steps:[],deliverable=m.deliverable||m.expectedDeliverable||'Nộp kết quả hoặc mô tả sản phẩm đã hoàn thành.';
          return common+`<div class="assessment-note"><strong>Nhiệm vụ</strong><p>${esc(m.task||m.statement||'Hoàn thành nhiệm vụ thực hành theo yêu cầu.')}</p><p><strong>Sản phẩm cần nộp:</strong> ${esc(deliverable)}</p>${m.tools?`<p><strong>Công cụ:</strong> ${esc(m.tools)}</p>`:''}</div>${steps.length?`<div class="assessment-practical-steps"><h4>Các bước thực hiện</h4><ol>${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}${rubricGuide(q,type,media)}<label class="assessment-field-label" for="answer-${esc(id)}">Mô tả kết quả / bằng chứng thực hiện</label><textarea id="answer-${esc(id)}" required class="text-input" name="${esc(id)}" rows="8" placeholder="Ghi các bước đã làm, kết quả, kiểm tra đã thực hiện và nơi lưu sản phẩm…"></textarea><p class="assessment-note">Mô tả sản phẩm và bằng chứng đã làm để hệ thống chấm theo rubric nội bộ; bài nộp tệp cần ghi tên tệp/đường dẫn hoặc mô tả đầu ra. Điểm rubric là phản hồi hỗ trợ học tập.</p></fieldset>`;
        }
        return common+`<textarea class="text-input" name="${esc(id)}" rows="5" aria-label="Trả lời"></textarea></fieldset>`;
      }
      const controlByData=(attribute,id)=>[...$('assessment-form').querySelectorAll(`[${attribute}]`)].find(el=>el.getAttribute(attribute)===String(id));
      async function loadCodeRunnerStatus(){try{codeRunnerStatus=await api.get('/api/ai-learning/code/status');const buttons=[...$('assessment-form').querySelectorAll('[data-run-code]')];buttons.forEach(btn=>{btn.title=codeRunnerStatus.enabled?'Executor biệt lập đã cấu hình.':'Code Runner chưa bật: '+(codeRunnerStatus.reason||'Thiếu executor biệt lập.');});if(buttons.length&&!codeRunnerStatus.enabled)message('⚠ Code Runner chưa bật trên máy chủ: '+(codeRunnerStatus.reason||'cần cấu hình executor biệt lập')+'. Nộp bài vẫn lưu được mã nguồn; câu lập trình chỉ được chấm điểm khi executor an toàn sẵn sàng.',true);else if(buttons.length&&codeRunnerStatus.enabled)message('Executor biệt lập đã sẵn sàng. Bạn có thể chạy code thử trước khi nộp.');}catch(_){codeRunnerStatus=null;}}
      function bindInteractions(){
        $('assessment-form').querySelectorAll('[data-up],[data-down]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.up||btn.dataset.down;const list=$(`order-${id}`);if(!list)return;const dir=btn.hasAttribute('data-up')?'up':'down',items=[...list.querySelectorAll('[data-order-item]')],row=btn.closest('[data-order-item]'),index=items.indexOf(row),target=index+(dir==='up'?-1:1);if(index<0||target<0||target>=items.length)return;if(dir==='up')list.insertBefore(items[index],items[target]);else list.insertBefore(items[target],items[index]);refreshOrderIndexes(id);});new Set([...$('assessment-form').querySelectorAll('[data-up],[data-down]')].map(btn=>btn.dataset.up||btn.dataset.down)).forEach(refreshOrderIndexes);
        $('assessment-form').querySelectorAll('[data-run-code]').forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.runCode,editor=controlByData('data-coding-editor',id),lang=controlByData('data-coding-language',id),stdin=controlByData('data-coding-stdin',id),out=controlByData('data-coding-output',id);if(!editor||!lang||!out){message('Không tìm thấy vùng nhập code/kết quả của câu này.',true);return;}btn.disabled=true;out.textContent='Đang kiểm tra trạng thái executor…';try{if(!codeRunnerStatus)await loadCodeRunnerStatus();if(codeRunnerStatus&&!codeRunnerStatus.enabled){out.textContent=`${codeRunnerStatus.message||'Code Runner chưa sẵn sàng.'}
Cấu hình máy chủ: CODE_RUNNER_ENABLED=true, CODE_RUNNER_EXECUTOR=remote, CODE_EXECUTOR_URL và CODE_EXECUTOR_TOKEN (>=32 ký tự).`;return;}out.textContent='Đang chạy trong executor biệt lập…';const r=await api.post('/api/ai-learning/code/execute',{language:lang.value,code:editor.value,stdin:stdin.value});out.textContent=[r.status,r.message||'',r.compileError||r.stderr||r.stdout||r.error||'Không có output.'].filter(Boolean).join('\n')}catch(e){out.textContent=`${e.code||''} ${e.message||'Không thể chạy code.'}`}finally{btn.disabled=false}});
        $('assessment-form').querySelectorAll('[data-record]').forEach(btn=>btn.onclick=()=>toggleRecord(btn.dataset.record,btn));
      }
      function refreshOrderIndexes(id){const rows=[...$(`order-${id}`).querySelectorAll('[data-order-item]')];rows.forEach((item,index)=>{item.querySelectorAll('button').forEach(b=>{b.dataset.index=String(index);b.disabled=b.hasAttribute('data-up')?index===0:index===rows.length-1;});});}
      async function toggleRecord(id,button){
        if(recordings[id]?.recorder){recordings[id].recorder.stop();return;}
        if(!navigator.mediaDevices?.getUserMedia){$(`[data-record-status="${id}"]`).textContent='Trình duyệt không hỗ trợ microphone.';return;}
        try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];const recorder=new MediaRecorder(stream);const started=Date.now();recordings[id]={recorder,chunks};recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});recordings[id].blob=blob;recordings[id].duration=Math.round((Date.now()-started)/1000);button.textContent='🎙 Thu lại';$(`[data-record-status="${id}"]`).textContent=`Đã thu ${recordings[id].duration}s. Bản thu sẽ chuyển review/AI khi phù hợp.`;};recorder.start();button.textContent='⏹ Dừng thu';$(`[data-record-status="${id}"]`).textContent='Đang thu…';}catch(e){$(`[data-record-status="${id}"]`).textContent='Không truy cập được microphone.'}}
      function collectAnswers(){
        const answers={};const form=$('assessment-form');new FormData(form).forEach((v,k)=>{if(k.startsWith('match:'))return;const prev=answers[k];answers[k]=prev===undefined?v:Array.isArray(prev)?[...prev,v]:[prev,v];});
        current.questions.forEach(q=>{const id=questionId(q),type=typeOf(q),fields=[...form.querySelectorAll('[name]')];if(type==='multiple_choice'){answers[id]=new FormData(form).getAll(id);}else if(type==='ordering'){answers[id]=[...$(`order-${id}`).querySelectorAll('[data-order-item]')].map(item=>item.dataset.value);}else if(type==='matching'){const map={};(q.options||[]).forEach((option,i)=>{const name=`match:${id}:${i}`,field=fields.find(el=>el.name===name);if(field){const key=String(optionValue(option)||optionLabel(option)||i);map[key]=field.value;}});answers[id]=map;}else if(type==='coding'){const editor=controlByData('data-coding-editor',id),lang=controlByData('data-coding-language',id);answers[id]={code:editor?.value||'',language:lang?.value||q.media?.language||'cpp'};}});return answers;
      }
      function restoreAnswers(saved={}){
        const form=$('assessment-form');
        for(const q of current?.questions||[]){
          const id=questionId(q); if(!Object.prototype.hasOwnProperty.call(saved,id))continue;
          const value=saved[id],type=typeOf(q),fields=[...form.querySelectorAll('[name]')];
          if(type==='coding'&&value&&typeof value==='object'){
            const editor=controlByData('data-coding-editor',id),language=controlByData('data-coding-language',id);
            if(editor)editor.value=String(value.code||'');if(language)language.value=String(value.language||q.media?.language||'cpp');continue;
          }
          if(type==='ordering'&&Array.isArray(value)){
            const list=$(`order-${id}`); if(list){const rows=[...list.querySelectorAll('[data-order-item]')];const rank=new Map(value.map((item,index)=>[String(item),index]));rows.sort((a,b)=>(rank.get(String(a.dataset.value))??999)-(rank.get(String(b.dataset.value))??999)).forEach(row=>list.appendChild(row));refreshOrderIndexes(id);}continue;
          }
          if(type==='matching'&&value&&typeof value==='object'){
            for(const [index,option] of (q.options||[]).entries()){const key=String(optionValue(option)||optionLabel(option)||index),field=fields.find(el=>el.name===`match:${id}:${index}`);if(field)field.value=String(value[key]??'');}continue;
          }
          const values=Array.isArray(value)?value.map(String):[String(value??'')];
          for(const field of fields.filter(el=>el.name===id)){if(['radio','checkbox'].includes(field.type))field.checked=values.includes(String(field.value));else if(field.tagName==='SELECT'&&field.multiple){[...field.options].forEach(option=>option.selected=values.includes(String(option.value)));}else field.value=values[0]||'';}
        }
      }
      function saveAnswerSnapshot(answers=collectAnswers(),force=false){
        if(!attempt?.attemptId||(isSubmitting&&!force))return Promise.resolve(false);
        const serialized=JSON.stringify(answers);if(serialized===lastSavedAnswers)return Promise.resolve(true);
        const attemptId=attempt.attemptId;
        autosaveInFlight=autosaveInFlight.catch(()=>{}).then(()=>api.put(`/api/assessment/attempts/${encodeURIComponent(attemptId)}/answers`,{answers})).then(()=>{lastSavedAnswers=serialized;return true;});
        return autosaveInFlight;
      }
      function scheduleAnswerSave(){if(!attempt||isSubmitting)return;clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{saveAnswerSnapshot().catch(error=>message(`Chưa lưu được bản nháp lên máy chủ: ${error.message}`,true));},350);}
      function unansweredQuestion(){const form=$('assessment-form');for(const q of current?.questions||[]){const id=questionId(q),type=typeOf(q),fields=[...form.querySelectorAll('[name]')],named=fields.filter(el=>el.name===id),checked=named.some(el=>el.checked&&el.value!==''),filled=named.some(el=>String(el.value||'').trim()!==''),matching=(q.options||[]).every((_,index)=>{const field=fields.find(el=>el.name===`match:${id}:${index}`);return Boolean(field&&String(field.value||'').trim())});let answered=true;if(['single_choice','true_false','image_based','reading_comprehension','listening'].includes(type))answered=checked;else if(type==='multiple_choice')answered=named.some(el=>el.checked);else if(type==='ordering')answered=(document.getElementById(`order-${id}`)?.querySelectorAll('[data-order-item]').length||0)>0;else if(type==='matching')answered=matching;else if(type==='coding')answered=Boolean(String(controlByData('data-coding-editor',id)?.value||'').trim());else if(type==='speaking')answered=Boolean(recordings[id]?.blob);else if(type==='practical'||type==='timed_simulation'||type==='essay'||type==='short_answer'||type==='fill_blank'||type==='numerical')answered=filled;if(!answered)return {id,question:q,container:[...form.querySelectorAll('[data-question-id]')].find(el=>el.dataset.questionId===id)};}return null;}
      async function load(){try{const values=items(await api.assessments());$('catalog-status').textContent=values.length?'Chọn một bài để xem và bắt đầu.':'Chưa có assessment đã công bố.';$('assessment-list').innerHTML=values.map(x=>`<article class="assessment-card"><div><strong>${esc(x.title||x.code)}</strong><small>${esc(x.grade?`Lớp ${x.grade} · `:'')}${esc(x.durationSeconds?`${Math.round(x.durationSeconds/60)} phút · `:'')}${esc(x.assessmentType||'TEST')} · ${esc(x.sourceRef?.sourceType||'ORIGINAL_PRACTICE')}</small></div><button class="button button-primary button-small" data-assessment-id="${esc(x._id||x.code)}">Xem và làm bài</button></article>`).join('');$('assessment-list').querySelectorAll('[data-assessment-id]').forEach(b=>b.onclick=()=>open(b.dataset.assessmentId));const requestedId=new URLSearchParams(location.search).get('id');if(requestedId)await open(requestedId);}catch(e){$('catalog-status').textContent=e.message}}
      async function open(id){try{current=await api.assessment(id);attempt=null;clearInterval(interval);setHidden('catalog-panel',true);setHidden('test-panel',false);setHidden('result-panel',true);$('timer').textContent='--:--';$('test-title').textContent=current.title||current.code;$('test-meta').innerHTML=`<span>${esc(current.questions?.length||0)} câu</span><span>${esc(Math.round((current.durationSeconds||0)/60))} phút</span><span>Đạt: ${esc(current.passingScore??'—')}%</span><span>${esc(({objective_percentage:'Chấm tự động câu khách quan',mixed:'Chấm kết hợp tự động + review',rubric:'Chấm theo rubric',weighted:'Chấm theo trọng số'})[current.scoring?.method]||'Chấm hỗn hợp')}</span>`;if(!$('assessment-form'))throw new Error('Thiếu vùng hiển thị biểu mẫu bài kiểm tra.');$('assessment-form').innerHTML=(current.questions||[]).map(renderQuestion).join('');bindInteractions();if($('submit-test'))$('submit-test').textContent='Bắt đầu bài kiểm tra';if($('submit-test'))$('submit-test').disabled=false;if($('submit-test'))$('submit-test').onclick=start;message(current.questions?.length?'Bấm “Bắt đầu bài kiểm tra”, sau đó làm bài và bấm “Nộp bài”.':'Bài kiểm tra chưa có câu hỏi đã xuất bản nên chưa thể bắt đầu.',!current.questions?.length);if(current.questions?.length)loadCodeRunnerStatus()}catch(e){message(e.message,true)}}
      async function start(){if(attempt||!current?.questions?.length)return;if($('submit-test'))$('submit-test').disabled=true;try{attempt=await api.post(`/api/assessment/${encodeURIComponent(current._id||current.code)}/attempts`,{});lastSavedAnswers=JSON.stringify(attempt.answers||{});restoreAnswers(attempt.answers||{});if($('submit-test'))$('submit-test').textContent='Nộp bài';if($('submit-test'))$('submit-test').onclick=()=>submit(false);const tick=()=>{const left=attempt.expiresAt?Math.max(0,Math.ceil((new Date(attempt.expiresAt).getTime()-Date.now())/1000)):null;$('timer').textContent=left===null?'--:--':`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(attempt.expiresAt&&left<=0){clearInterval(interval);submit(true)}};clearInterval(interval);tick();interval=setInterval(tick,1000);message(attempt.resumed?'Đã khôi phục lượt làm bài và câu trả lời đã lưu trên máy chủ.':'Đã bắt đầu lượt làm bài. Câu trả lời được tự động lưu lên máy chủ.')}catch(e){attempt=null;message(e.message,true)}finally{if($('submit-test'))$('submit-test').disabled=false}}
      async function submit(autoSubmit=false){if(!attempt||isSubmitting)return;const missing=unansweredQuestion();if(missing&&!autoSubmit&&!window.confirm(`Bạn còn câu chưa trả lời (câu ${current.questions.findIndex(q=>questionId(q)===missing.id)+1}). Nhấn OK để nộp bài với câu bỏ trống, hoặc Cancel để quay lại làm tiếp.`)){missing.container?.scrollIntoView({behavior:'smooth',block:'center'});missing.container?.querySelector('input,textarea,select,button')?.focus({preventScroll:true});message('Bạn có thể tiếp tục làm bài hoặc xác nhận nộp với câu bỏ trống.',true);return;}isSubmitting=true;clearInterval(interval);clearTimeout(autosaveTimer);if($('submit-test'))$('submit-test').disabled=true;const answers=collectAnswers();try{if(!autoSubmit&&attempt?.expiresAt&&Date.now()<new Date(attempt.expiresAt).getTime()){await saveAnswerSnapshot(answers,true).catch(()=>{});}for(const q of current.questions||[]){const id=questionId(q);if(typeOf(q)==='speaking'&&recordings[id]?.blob){try{const base64=await blobToBase64(recordings[id].blob);const exam=/IELTS/i.test(`${current.code} ${current.title}`)?'IELTS':'TOEIC';const speech=await api.post('/api/ai-learning/english/speaking/analyze',{exam,task:q.prompt,variant:current.code,prompt:q.prompt,audioBase64:base64,expectedText:''});answers[id]={recorded:true,duration:recordings[id].duration, speakingAttemptId:speech?.attempt?._id||speech?.attemptId||null};}catch(e){answers[id]={recorded:true,duration:recordings[id].duration,analysisStatus:'REVIEW_REQUIRED',analysisError:e.message};}}}const r=await api.post(`/api/assessment/attempts/${encodeURIComponent(attempt.attemptId)}/submit`,{answers});setHidden('test-panel',true);setHidden('result-panel',false);if($('result-title'))$('result-title').textContent=`Kết quả: ${r.score}%`;if($('result-summary'))$('result-summary').textContent=`${r.passed===null?'Đang review':r.passed?'Đạt':'Chưa đạt'} · Mốc đạt ${r.passingScore??'—'}% · ${r.status}`;if($('result-review'))$('result-review').innerHTML=(r.result?.details||[]).map(x=>{const status=x.requiresReview?'Chưa có công cụ chấm tự động cho mục này':x.isCorrect?'Đạt ngưỡng':'Cần cải thiện';const scoreLabel=x.requiresReview?'Chưa có điểm tự động':`${Number(x.points||0)}/${Number(x.maxPoints||0)} điểm`;const feedback=x.feedback?` · ${x.feedback}`:'';const coding=x.coding?` · Test công khai ${Number(x.coding.visible?.passed||0)}/${Number(x.coding.visible?.total||0)} · Test ẩn ${Number(x.coding.hiddenSummary?.passed||0)}/${Number(x.coding.hiddenSummary?.total||0)} (chỉ tổng hợp)`:'';return `<article class="data-item"><strong>${esc(x.prompt)}</strong><small>${esc(scoreLabel)} · ${esc(status)} · ${esc(x.gradingStatus||'')} ${esc(coding)} ${esc(x.explanation||x.coding?.message||'')}${esc(feedback)}</small></article>`}).join('')}catch(e){message(e.message,true)}finally{isSubmitting=false;if($('submit-test'))$('submit-test').disabled=false}}
      function blobToBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>resolve(String(reader.result||'').split(',').pop()||'');reader.readAsDataURL(blob);});}
      $('assessment-form').addEventListener('input',scheduleAnswerSave);$('assessment-form').addEventListener('change',scheduleAnswerSave);if($('back-catalog'))$('back-catalog').onclick=e=>{e.preventDefault();clearInterval(interval);clearTimeout(autosaveTimer);setHidden('test-panel',true);setHidden('catalog-panel',false);load()};load();
    })();
  </script>
